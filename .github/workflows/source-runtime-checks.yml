name: Source runtime checks (no publication or Store access)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Focused affected checks; no Store or publication
        type: choice
        required: true
        default: headers
        options: [headers, coil, ios, coil-and-ios, wire-version]

permissions:
  contents: read
  packages: read

concurrency:
  group: kira-source-runtime-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  headers:
    if: ${{ github.ref == 'refs/heads/remediation/app-priority-sources-20261017' && (inputs.scope == 'headers' || inputs.scope == 'coil' || inputs.scope == 'coil-and-ios') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      KIRA_PACKAGES_USER: ${{ github.actor }}
    steps:
      - name: Check out exact source candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify existing toolchain pins
        run: /usr/bin/ruby scripts/release/verify-toolchain-inputs.rb
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Reuse dependencies without writing shared caches
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Verify image and download header boundaries and compile Android
        id: verify
        env:
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
          CHECK_SCOPE: ${{ inputs.scope }}
        run: |
          stop_owned() {
            local home="${GRADLE_USER_HOME:-$HOME/.gradle}" launcher
            for launcher in "$home"/wrapper/dists/gradle-9.6.1-bin/*/gradle-9.6.1/bin/gradle; do
              [[ -x "$launcher" && ! -L "$launcher" ]] || continue
              timeout 60s "$launcher" --offline --stop
              return $?
            done
            [[ ! -d "$home/daemon" ]]
          }
          finish() {
            local build_status=$? stop_status=0
            trap - EXIT
            stop_owned || stop_status=$?
            if [[ "$stop_status" == 0 ]]; then
              echo 'workers_stopped=true' >> "$GITHUB_OUTPUT"
            else
              echo '::error::Owned Gradle shutdown failed; not reported clean.'
            fi
            [[ "$build_status" == 0 ]] || exit "$build_status"
            exit "$stop_status"
          }
          echo 'workers_stopped=false' >> "$GITHUB_OUTPUT"
          trap finish EXIT
          tasks=(:composeApp:desktopTest --tests 'me.manga.kira.sources.runtime.CoilSourceHeaderInterceptorTest')
          if [[ "$CHECK_SCOPE" == headers ]]; then
            tasks+=(--tests 'me.manga.kira.sources.runtime.SourceImageHeadersTest'
              --tests 'me.manga.kira.sources.runtime.RegistryChapterPageProviderTest'
              :data:download:desktopTest
              --tests 'me.manga.kira.presentation.features.download.domain.clean.HeaderRefreshRulesTest'
              :composeApp:compileAndroidMain)
          fi
          ./gradlew --continue --no-daemon --no-build-cache --no-configuration-cache \
            --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g \
            -Pkotlin.compiler.execution.strategy=in-process "${tasks[@]}" --stacktrace
      - name: Retain small XML evidence outside disposable build directories
        if: ${{ always() }}
        run: |
          python3 -B - <<'PY'
          import os, pathlib, shutil
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-runtime-evidence'
          target.mkdir(mode=0o700)
          (target / 'source-sha.txt').write_text(os.environ['GITHUB_SHA'] + '\n')
          for module in ('composeApp', 'data/download'):
              files = list(pathlib.Path(module, 'build/test-results/desktopTest').glob('*.xml'))
              assert len(files) <= 20
              for source in files:
                  assert source.is_file() and not source.is_symlink() and source.stat().st_size <= 2 * 1024 * 1024
                  destination = target / module / source.name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, destination)
          PY
      - name: Preserve focused test evidence
        id: evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-runtime-tests-${{ github.sha }}
          path: ${{ runner.temp }}/source-runtime-evidence
          if-no-files-found: warn
          retention-days: 3
      - name: Clean owned disposable outputs
        if: ${{ always() }}
        env:
          WORKERS_STOPPED: ${{ steps.verify.outputs.workers_stopped }}
        run: |
          [[ "$WORKERS_STOPPED" != false ]] || { echo '::error::Refusing to delete live workers outputs'; exit 1; }
          python3 -B scripts/release/clean-mobile-build.py
      - name: Remove the uploaded local evidence copy
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        run: |
          python3 -B - <<'PY'
          import os, pathlib, shutil
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-runtime-evidence'
          assert not target.is_symlink()
          shutil.rmtree(target)
          PY

  wire-version:
    if: ${{ github.ref == 'refs/heads/remediation/app-priority-sources-20261017' && inputs.scope == 'wire-version' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      KIRA_PACKAGES_USER: ${{ github.actor }}
    steps:
      - name: Check out exact source candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify existing toolchain pins
        run: /usr/bin/ruby scripts/release/verify-toolchain-inputs.rb
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Reuse dependencies without writing shared caches
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Qualify actual generated wire version and release conflict guard
        env:
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: |
          umask 077
          evidence="$RUNNER_TEMP/source-wire-version.txt"
          original="$RUNNER_TEMP/source-wire-version-original.properties"
          cp release/version.properties "$original"
          printf 'Source commit: %s\n' "$GITHUB_SHA" > "$evidence"
          finish() {
            local status=$? stop_status=0 launcher found=false
            trap - EXIT
            if cp "$original" release/version.properties; then
              rm -f -- "$original"
            else
              status=1
            fi
            for launcher in "${GRADLE_USER_HOME:-$HOME/.gradle}"/wrapper/dists/gradle-9.6.1-bin/*/gradle-9.6.1/bin/gradle; do
              [[ -x "$launcher" && ! -L "$launcher" ]] || continue
              found=true
              timeout 60s "$launcher" --offline --stop || stop_status=$?
              break
            done
            if [[ "$found" == false && -d "${GRADLE_USER_HOME:-$HOME/.gradle}/daemon" ]]; then
              stop_status=1
            fi
            if [[ "$stop_status" == 0 ]]; then
              python3 -B scripts/release/clean-mobile-build.py || stop_status=$?
            fi
            printf 'qualification_exit=%s cleanup_exit=%s\n' "$status" "$stop_status" >> "$evidence"
            df -h .
            free -h
            [[ "$status" == 0 ]] || exit "$status"
            exit "$stop_status"
          }
          trap finish EXIT
          unset MOBILE_RELEASE_VERSION_NAME MARKETING_VERSION
          for version in 9.0.1 9.0.2; do
            # Synthetic inputs exist only in this check-only runner, never a release branch/train.
            VERSION_FIXTURE="$version" python3 -B - <<'PY'
          import os, pathlib, re
          path = pathlib.Path('release/version.properties')
          text, count = re.subn(r'^VERSION_NAME=.*$', 'VERSION_NAME=' + os.environ['VERSION_FIXTURE'], path.read_text(), flags=re.M)
          assert count == 1
          path.write_text(text)
          PY
            export KIRA_VERSION_NAME="$version" KIRA_APP_VERSION="$version"
            [[ "$(ruby release/version.rb)" == "$version" ]]
            ./gradlew --no-daemon --no-build-cache --no-configuration-cache --max-workers=1 \
              -Dorg.gradle.jvmargs=-Xmx2g -Pkotlin.compiler.execution.strategy=in-process \
              :composeApp:generateSourceRemoteConfig
            ruby release/version.rb verify-generated >> "$evidence"
          done
          if KIRA_APP_VERSION=9.0.1 ruby release/version.rb > /dev/null 2>&1; then
            echo '::error::Conflicting release wire version was accepted'
            exit 1
          fi
          printf 'conflicting_release_input_rejected=true\n' >> "$evidence"
      - name: Preserve public version and cleanup evidence
        id: evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-wire-version-${{ github.sha }}
          path: ${{ runner.temp }}/source-wire-version.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Remove uploaded evidence copy
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        run: rm -f -- "$RUNNER_TEMP/source-wire-version.txt"

  ios:
    if: ${{ github.ref == 'refs/heads/remediation/app-priority-sources-20261017' && (inputs.scope == 'ios' || inputs.scope == 'coil-and-ios') }}
    runs-on: macos-latest
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      KIRA_PACKAGES_USER: ${{ github.actor }}
    steps:
      - name: Check out exact source candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify existing toolchain pins
        run: /usr/bin/ruby scripts/release/verify-toolchain-inputs.rb
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare authenticated libffi source and private compiler
        id: bootstrap
        timeout-minutes: 15
        run: python3 -B scripts/release/prepare-libffi-source.py prepare
      - name: Select isolated Gradle location
        run: printf 'GRADLE_USER_HOME=%s/source-runtime-native/gradle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify Native repository regressions and compile reader log redaction
        id: verify
        timeout-minutes: 43
        env:
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: python3 -B scripts/release/check-source-runtime-ios.py
      - name: Verify the private compiler after Native use
        if: ${{ always() && steps.bootstrap.outcome == 'success' }}
        run: python3 -B scripts/release/prepare-libffi-source.py verify
      - name: Remove private compiler and source bootstrap outputs
        if: ${{ always() && steps.verify.outputs.workers_stopped != 'false' }}
        run: python3 -B scripts/release/prepare-libffi-source.py cleanup
      - name: Clean owned build outputs and Native scratch
        if: ${{ always() && steps.verify.outputs.workers_stopped != 'false' }}
        run: |
          python3 -B scripts/release/clean-mobile-build.py
          python3 -B - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-runtime-native'
          assert not root.is_symlink()
          if root.exists():
              owner = {k: os.environ[k] for k in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA')}
              assert json.loads((root / 'owner.json').read_text()) == owner
              shutil.rmtree(root)
          PY
      - name: Admit only this run's small evidence for upload
        id: admit_evidence
        if: ${{ always() }}
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          evidence = temp / 'source-runtime-ios-evidence'
          assert not evidence.is_symlink()
          if evidence.exists():
              source = evidence / 'source.json'
              assert not source.is_symlink() and source.stat().st_size <= 131072
              owner = {k: os.environ[k] for k in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA')}
              assert json.loads(source.read_text()) == owner
          provenance = temp / 'kira-libffi-provenance.json'
          assert not provenance.is_symlink()
          if provenance.exists():
              assert provenance.stat().st_size <= 131072
              owner = json.loads(provenance.read_text())['owner']
              assert owner['repository'] == os.environ['GITHUB_REPOSITORY']
              assert owner['run_id'] == os.environ['GITHUB_RUN_ID'] and owner['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
              assert owner['root'] == str(temp / 'kira-libffi-source')
          PY
      - name: Preserve focused Native evidence and bootstrap receipt
        id: evidence
        if: ${{ always() && steps.admit_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-runtime-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source-runtime-ios-evidence
            ${{ runner.temp }}/kira-libffi-provenance.json
          retention-days: 3
          if-no-files-found: warn
      - name: Remove the uploaded local evidence copy
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, shutil
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          evidence = temp / 'source-runtime-ios-evidence'
          assert not evidence.is_symlink()
          if evidence.exists():
              owner = {k: os.environ[k] for k in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA')}
              assert json.loads((evidence / 'source.json').read_text()) == owner
              shutil.rmtree(evidence)
          provenance = temp / 'kira-libffi-provenance.json'
          assert not provenance.is_symlink()
          if provenance.exists():
              owner = json.loads(provenance.read_text())['owner']
              assert owner['repository'] == os.environ['GITHUB_REPOSITORY']
              assert owner['run_id'] == os.environ['GITHUB_RUN_ID'] and owner['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
              assert owner['root'] == str(temp / 'kira-libffi-source')
              provenance.unlink()
          PY
