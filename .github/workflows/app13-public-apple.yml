# UNBOUND authoring draft. Primary binding and independent admission review are required.
name: App13 public Apple compile
on:
  push:
    branches: [remediation/app-13-public-apple-validation-02]
    paths: [ci/app13-public-apple.request.json]
permissions:
  contents: read
concurrency:
  group: app13-public-apple-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    if: >-
      ${{ github.repository == 'kira-manga/kira-app' && github.event.repository.private == false &&
          github.event_name == 'push' && github.ref == 'refs/heads/remediation/app-13-public-apple-validation-02' &&
          github.run_attempt == 1 }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Exact control carrier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Admit bound one-attempt request
        id: request
        timeout-minutes: 1
        run: python3 -B control/ci/app13-public-apple.py request
      - name: Exact unmodified App source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        timeout-minutes: 1
        with:
          repository: kira-manga/kira-app
          ref: ${{ steps.request.outputs.source_sha }}
          path: app
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Exact original public Engine source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        timeout-minutes: 1
        with:
          repository: kira-manga/kira-source-engine
          ref: ${{ steps.request.outputs.engine_sha }}
          path: engine
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Sole ordinary App simulator main compile
        id: compile
        timeout-minutes: 25
        env:
          APP13_RUN: ${{ runner.temp }}/app13-apple-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B control/ci/app13-public-apple.py compile
      - name: Bounded evidence after final owned absence
        if: ${{ always() && steps.compile.outputs.retention_ready == 'true' }}
        env:
          APP13_RUN: ${{ runner.temp }}/app13-apple-${{ github.run_id }}-${{ github.run_attempt }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 1
        with:
          name: app13-public-apple-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false
          path: |
            ${{ env.APP13_RUN }}/reports/request.json
            ${{ env.APP13_RUN }}/reports/result.json
            ${{ env.APP13_RUN }}/reports/identity.json
            ${{ env.APP13_RUN }}/reports/source.json
            ${{ env.APP13_RUN }}/reports/tools.json
            ${{ env.APP13_RUN }}/reports/app-tasks.json
            ${{ env.APP13_RUN }}/reports/engine-tasks.json
            ${{ env.APP13_RUN }}/reports/proof.json
            ${{ env.APP13_RUN }}/reports/commands.json
            ${{ env.APP13_RUN }}/reports/compile.log
            ${{ env.APP13_RUN }}/reports/gradle-stop-immediate.log
            ${{ env.APP13_RUN }}/reports/gradle-stop-final.log
