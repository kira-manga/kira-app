name: Targeted corrected iOS retained-page retry
on:
  push:
    branches: [validation/app-seven-apple-retry-20260915-08]
    paths: [.github/workflows/app5-ios-host.yml]
permissions:
  contents: read
concurrency:
  group: kira-targeted-apple-host
  cancel-in-progress: false
jobs:
  host:
    if: github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 55
    env:
      SOURCE_SHA: dff1ff5675889dc20debd9da5f73e2049bcbf7a3
      ENGINE_SHA: ed184165ebd3ee7f0d1db533cc40ca5a0868fdda
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      KIRA_SOURCE_CONFIG_BASE_URL: ''
      KIRA_SOURCE_CONFIG_PINNED_KEYS: ''
      KIRA_APP_VERSION: '1.0.5'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: kira-manga/kira-source-engine
          ref: ${{ env.ENGINE_SHA }}
          path: engine
          persist-credentials: false
      - name: Corrected retained-page retry only
        timeout-minutes: 50
        shell: bash
        run: bash control/ci/app63-apple.sh
      - name: Compact verification evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-seven-native-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 3
