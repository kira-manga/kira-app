name: App26 Native02 manual-Retry single-method rerun; standard KGP simulator lifecycle

on:
  push:
    branches: [remediation/app26-retry-native-20260920-02]

permissions:
  contents: read

concurrency:
  group: app32-apple-batch-01
  cancel-in-progress: false

jobs:
  apple:
    if: >-
      github.repository == 'kira-manga/kira-app' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/remediation/app26-retry-native-20260920-02' &&
      github.event.created == true && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 65
    env:
      # Packet copies only: primary binds a fresh source-only parent and this isolated branch.
      APP32_BRANCH: remediation/app26-retry-native-20260920-02
      APP32_SOURCE_SHA: 3e6c6c818ffa81cf7e2be5be58cde68c4fa263b8
      APP32_SOURCE_TREE: 4d8c57d0a61b81324eaa3eb44a1208c7297db3f6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        id: checkout
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: One corrected App26 Native02 method; no UI automation
        timeout-minutes: 55
        env:
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: python3 -B scripts/ci/app32-apple-batch.py run

      - name: Always stop owned work and delete only fresh outputs
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 5
        env:
          # Redaction during interrupted report intake; offline stop receives no token.
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: python3 -B scripts/ci/app32-apple-batch.py cleanup

      - name: Retain bounded diagnostic evidence, including failures
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app32-apple-${{ github.sha }}-attempt1
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
          path: |
            ${{ runner.temp }}/app32-apple-batch-01-${{ github.run_id }}-${{ github.run_attempt }}-evidence/*.json
            ${{ runner.temp }}/app32-apple-batch-01-${{ github.run_id }}-${{ github.run_attempt }}-evidence/*.log
            ${{ runner.temp }}/app32-apple-batch-01-${{ github.run_id }}-${{ github.run_attempt }}-evidence/reports/**/*.xml

      - name: Discard owned local evidence after the upload attempt
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 1
        run: python3 -B scripts/ci/app32-apple-batch.py discard
