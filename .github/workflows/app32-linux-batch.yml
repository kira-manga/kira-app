name: App84 targeted linux verification

on:
  push:
    branches: [remediation/app84-linux-20260920-01]

permissions:
  contents: read

concurrency:
  group: app84-linux-targeted
  cancel-in-progress: false

jobs:
  linux:
    if: >-
      github.repository == 'kira-manga/kira-app' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/remediation/app84-linux-20260920-01' &&
      github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      # Copies only: primary binds these to a fresh reviewed source-only parent, never old HEAD.
      APP32_BRANCH: remediation/app84-linux-20260920-01
      APP32_SOURCE_SHA: fdecfb5d98f14f004ecd8db075e49a7388fc95c7
      APP32_SOURCE_TREE: dcfcdd3765b8253c9d2bd44457f5714b982696c3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        id: checkout
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: One normal compile and selected-test invocation
        timeout-minutes: 42
        env:
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: python3 -B scripts/ci/app32-linux-batch.py run

      - name: Always stop and remove only this run's owned runtime and fresh outputs
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 3
        env:
          # Redaction during interrupted-run report intake; stop is offline and receives no token.
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: python3 -B scripts/ci/app32-linux-batch.py cleanup

      - name: Retain bounded validation evidence, including failures
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app32-linux-${{ github.sha }}-attempt1
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
          path: |
            ${{ runner.temp }}/app32-linux-batch-01-${{ github.run_id }}-${{ github.run_attempt }}-evidence/*.json
            ${{ runner.temp }}/app32-linux-batch-01-${{ github.run_id }}-${{ github.run_attempt }}-evidence/*.log
            ${{ runner.temp }}/app32-linux-batch-01-${{ github.run_id }}-${{ github.run_attempt }}-evidence/reports/**/*.xml

      - name: Discard owned local evidence after the upload attempt
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 1
        run: python3 -B scripts/ci/app32-linux-batch.py discard
