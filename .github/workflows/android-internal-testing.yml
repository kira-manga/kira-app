name: Android Internal and Open Testing

on:
  push:
    branches:
      - internal-testing
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: kira-android-internal-testing
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Validate, sign, and upload Android Internal and Open testing
    if: >-
      ${{ github.ref == 'refs/heads/internal-testing' &&
          !contains(github.event.head_commit.message || '', '[skip android]') &&
          !contains(github.event.head_commit.message || '', '[skip both]') }}
    environment: google-play-internal
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      KIRA_PACKAGES_USER: ${{ github.actor }}
      KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
      FASTLANE_OPT_OUT_USAGE: "1"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_DISABLE_COLORS: "1"
      KIRA_SOURCE_CONFIG_BASE_URL: ${{ vars.KIRA_SOURCE_CONFIG_BASE_URL }}
      KIRA_SOURCE_CONFIG_PINNED_KEYS: ${{ vars.KIRA_SOURCE_CONFIG_PINNED_KEYS }}
      ANDROID_BUILD_NUMBER_OFFSET: ${{ vars.ANDROID_BUILD_NUMBER_OFFSET || '1000' }}

    steps:
      - name: Check out internal-testing
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Ruby and pinned Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate protected inputs and select a unique version code
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set +x
          required=(
            ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD GOOGLE_SERVICES_JSON GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
            KIRA_SOURCE_CONFIG_BASE_URL KIRA_SOURCE_CONFIG_PINNED_KEYS
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing protected release input: $name"
              exit 1
            fi
          done

          ruby -rjson -e 'JSON.parse(ENV.fetch("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON")); puts "Play service-account JSON is valid"'

          version_name="$(awk -F= '$1 == "VERSION_NAME" { print $2 }' release/version.properties | tr -d '\r')"
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]] || {
            echo "::error::VERSION_NAME in release/version.properties is invalid"
            exit 1
          }

          [[ "$ANDROID_BUILD_NUMBER_OFFSET" =~ ^[0-9]+$ ]] || {
            echo "::error::ANDROID_BUILD_NUMBER_OFFSET must be a non-negative integer"
            exit 1
          }
          build_number=$((ANDROID_BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))
          (( build_number > 0 && build_number <= 2100000000 )) || {
            echo "::error::Computed Android version code is outside Play Console limits"
            exit 1
          }

          {
            printf 'KIRA_VERSION_NAME=%s\n' "$version_name"
            printf 'KIRA_BUILD_NUMBER=%s\n' "$build_number"
          } >> "$GITHUB_ENV"
          echo "Using version $version_name ($build_number)"

      - name: Verify the HTTPS source-config authority is live and signed
        env:
          KIRA_SOURCE_CONFIG_BASE_URL: ${{ vars.KIRA_SOURCE_CONFIG_BASE_URL }}
          KIRA_SOURCE_CONFIG_PINNED_KEYS: ${{ vars.KIRA_SOURCE_CONFIG_PINNED_KEYS }}
        run: |
          set +x
          base_url="${KIRA_SOURCE_CONFIG_BASE_URL%/}"
          headers="$RUNNER_TEMP/kira-source-document.headers"
          body="$RUNNER_TEMP/kira-source-document.json"
          curl --fail-with-body --silent --show-error --location --max-time 30 \
            --proto '=https' --tlsv1.2 \
            -D "$headers" -o "$body" \
            "$base_url/api/v1/source-config/document"

          for header in \
            x-config-signature-format x-config-signature-algorithm \
            x-config-signing-key-id x-config-signature \
            x-config-revision x-config-checksum x-config-created-at; do
            if ! grep -Eiq "^${header}:[[:space:]]*[^[:space:]].*$" "$headers"; then
              echo "::error::Source-config response is missing signed header: $header"
              exit 1
            fi
          done

          key_id="$(awk -F': *' 'tolower($1) == "x-config-signing-key-id" { print $2 }' "$headers" | tr -d '\r')"
          if ! printf '%s\n' "$KIRA_SOURCE_CONFIG_PINNED_KEYS" | tr ',' '\n' |
            awk -F= -v expected="$key_id" '$1 == expected { found = 1 } END { exit(found ? 0 : 1) }'; then
            echo "::error::Live source-config signing key id is not present in KIRA_SOURCE_CONFIG_PINNED_KEYS"
            exit 1
          fi
          echo "Verified HTTPS source-config endpoint and pinned signing key id: $key_id"

      - name: Verify Google Play Internal and Open testing are publishable
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          KIRA_ANDROID_PACKAGE_NAME: me.manga.kira
        run: |
          set +x
          ruby scripts/release/google-play-open-testing.rb preflight

      - name: Decode real Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set +x
          umask 077
          ruby -rbase64 -e '
            encoded = ENV.fetch("GOOGLE_SERVICES_JSON").gsub(/\s+/, "")
            decoded = Base64.strict_decode64(encoded)
            abort("GOOGLE_SERVICES_JSON decoded to an empty file") if decoded.empty?
            path = File.join(ENV.fetch("GITHUB_WORKSPACE"), "app/google-services.json")
            File.binwrite(path, decoded)
            File.chmod(0o600, path)
          '

      - name: Reconstruct the Android upload keystore in the runner temp directory
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set +x
          umask 077
          export KIRA_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/kira-upload.jks"
          ruby -rbase64 -e '
            encoded = ENV.fetch("ANDROID_KEYSTORE_BASE64").gsub(/\s+/, "")
            decoded = Base64.strict_decode64(encoded)
            abort("ANDROID_KEYSTORE_BASE64 decoded to an empty file") if decoded.empty?
            path = ENV.fetch("KIRA_ANDROID_KEYSTORE_PATH")
            File.binwrite(path, decoded)
            File.chmod(0o600, path)
          '
          printf 'KIRA_ANDROID_KEYSTORE_PATH=%s\n' "$KIRA_ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Run Android tests, lint, R8, and signed AAB build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/kira-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew \
            :core:desktopTest :domain:desktopTest :data:desktopTest \
            :data:local:desktopTest :data:download:desktopTest :platform:desktopTest \
            :presentation:desktopTest :composeApp:desktopTest :ui:desktopTest \
            :sources:engine:desktopTest :sources:config:desktopTest :sources:legacy:desktopTest \
            :app:testDebugUnitTest :app:lintRelease :app:bundleRelease \
            --stacktrace

          signature_report="$RUNNER_TEMP/kira-aab-signature.txt"
          jarsigner -verify -certs \
            app/build/outputs/bundle/release/app-release.aab \
            > "$signature_report" 2>&1
          if ! grep -q '^jar verified\.' "$signature_report"; then
            echo '::error::The signed AAB did not pass jarsigner verification'
            exit 1
          fi
          echo 'Signed AAB signature verification passed'

      - name: Upload the signed AAB to Google Play Internal testing
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          KIRA_ANDROID_AAB_PATH: ${{ github.workspace }}/app/build/outputs/bundle/release/app-release.aab
          KIRA_ANDROID_MAPPING_PATH: ${{ github.workspace }}/app/build/outputs/mapping/release/mapping.txt
        run: bundle exec fastlane android upload_internal

      - name: Publish the Internal version to Google Play Open testing
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          KIRA_ANDROID_PACKAGE_NAME: me.manga.kira
        run: |
          set +x
          ruby scripts/release/google-play-open-testing.rb publish

      - name: Preserve signed AAB and R8 mapping as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kira-android-testing-${{ env.KIRA_BUILD_NUMBER }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: error

      - name: Remove temporary release credentials and Firebase configuration
        if: ${{ always() }}
        run: |
          set +x
          rm -f "$RUNNER_TEMP/kira-upload.jks"
          rm -f "$GITHUB_WORKSPACE/app/google-services.json"
