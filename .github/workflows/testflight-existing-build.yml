name: Finalize existing TestFlight 1.0.7 (1)

# Owner-authorized existing-build submission only. No build, signing, or binary upload.
on:
  push:
    branches: [remediation/app-testflight-existing-107-20261020]
    paths: [.github/workflows/testflight-existing-build.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kira-testflight-upload
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.ref == 'refs/heads/remediation/app-testflight-existing-107-20261020' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      FASTLANE_OPT_OUT_USAGE: "1"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_DISABLE_COLORS: "1"
      CI: "true"
      BUNDLE_FROZEN: "true"
      KIRA_BUILD_NUMBER: "1"

    steps:
      - name: Check out only the reviewed existing-build submission change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify existing toolchain pins before credentials
        run: /usr/bin/ruby scripts/release/verify-toolchain-inputs.rb

      - name: Initialize owned runtime paths
        run: |
          {
            printf 'BUNDLE_PATH=%s/kira-beta-gems\n' "$RUNNER_TEMP"
            printf 'APP_STORE_CONNECT_KEY_PATH=%s/kira-beta-key/AuthKey.p8\n' "$RUNNER_TEMP"
            printf 'KIRA_TESTFLIGHT_STATUS_FILE=%s/kira-beta-reports/testflight-status.json\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Confirm the exact successful Apple upload and isolated Android failure (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/kira-beta-reports"
          gh api repos/kira-manga/kira-app/actions/runs/39390175287/attempts/1 > "$RUNNER_TEMP/kira-beta-reports/release-run.json"
          gh api 'repos/kira-manga/kira-app/actions/runs/39390175287/attempts/1/jobs?per_page=100' > "$RUNNER_TEMP/kira-beta-reports/release-jobs.json"
          gh api repos/kira-manga/kira-app/actions/artifacts/12253131302 > "$RUNNER_TEMP/kira-beta-reports/release-artifact.json"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          base = '84881a3b3f24d62f1671cb29c04d79cf9598a484'
          if subprocess.run(['git', 'cat-file', '-e', base], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode:
              subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', base], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          assert set(changed) <= {'.github/workflows/testflight-existing-build.yml'}, 'Unrelated source/dependency changes'
          p = Path(os.environ['RUNNER_TEMP']) / 'kira-beta-reports'
          r = json.loads((p / 'release-run.json').read_text())
          page = json.loads((p / 'release-jobs.json').read_text())
          a = json.loads((p / 'release-artifact.json').read_text())
          assert r['id'] == 39390175287 and r['run_attempt'] == 1 and r['head_sha'] == base
          assert r['repository']['id'] == 1289256257 and r['repository']['full_name'] == 'kira-manga/kira-app'
          assert r['workflow_id'] == 319592317 and r['path'] == '.github/workflows/internal-testing-release.yml'
          assert r['head_branch'] == 'internal-testing' and r['event'] == 'push'
          assert r['status'] == 'completed' and r['conclusion'] == 'failure'
          expected = {
              118519533916: ('Validate release request', 'success'),
              118519571934: ('Shared app tests before either Store upload / Existing shared tests and Android integration checks', 'success'),
              118523250595: ('Android Internal Testing / Validate, sign, and upload Android Internal testing', 'failure'),
              118523250548: ('iOS TestFlight / Signed iOS archive and TestFlight upload', 'success'),
          }
          assert page['total_count'] == 4 and len(page['jobs']) == 4
          jobs = {job['id']: job for job in page['jobs']}
          assert set(jobs) == set(expected), 'Unexpected release jobs'
          for job_id, job in jobs.items():
              assert job['run_id'] == r['id'] and job['run_attempt'] == 1 and job['head_sha'] == base
              assert job['head_branch'] == 'internal-testing' and job['status'] == 'completed'
              assert (job['name'], job['conclusion']) == expected[job_id]
              assert all(step['status'] == 'completed' for step in job['steps'])
              if job_id != 118523250595:
                  assert all(step['conclusion'] == 'success' for step in job['steps'])
          def require_step(job_id, name, conclusion='success'):
              matches = [step for step in jobs[job_id]['steps'] if step['name'] == name]
              assert len(matches) == 1 and matches[0]['conclusion'] == conclusion, name
          require_step(118519533916, 'Require the internal-testing branch')
          require_step(118519571934, 'Run existing shared, persistence, transport and Android tests in one batch')
          require_step(118519571934, 'Clean disposable build outputs')
          for name in [
              'Validate the signed archive, IPA, entitlements, and dSYM UUIDs',
              'Upload to TestFlight without external distribution or review submission',
              'Query final App Store Connect state',
          ]:
              require_step(118523250548, name)
          android = jobs[118523250595]
          failure = 'Validate protected inputs and select the next unused Play version code'
          assert [step['name'] for step in android['steps'] if step['conclusion'] == 'failure'] == [failure]
          assert all(step['conclusion'] in {'success', 'failure', 'skipped'} for step in android['steps'])
          for name in [
              'Run Android lint, R8, and signed AAB verification',
              'Upload the signed AAB to Google Play Internal testing',
              'Verify the exact completed Google Play Internal release',
          ]:
              require_step(118523250595, name, 'skipped')
          require_step(118523250595, 'Remove temporary release credentials and Firebase configuration')
          require_step(118523250595, 'Clean disposable build outputs')
          assert a['id'] == 12253131302 and a['name'] == 'kira-ios-1.0.7-1' and a['expired'] is False
          assert a['size_in_bytes'] == 117167331
          assert a['digest'] == 'sha256:99ddc5dd3eb0f49fd2d34eea9d2e3927fed1a8b15157eba30c9360fde0e7c591'
          ar = a['workflow_run']
          assert ar['id'] == r['id'] and ar['head_sha'] == base and ar['head_branch'] == 'internal-testing'
          assert ar['repository_id'] == 1289256257 and ar['head_repository_id'] == 1289256257
          print('Exact existing signed release and Apple upload gates verified; no binary rebuild/upload')
          PY

      - name: Set up Ruby and locked Bundler
        uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1
        with:
          ruby-version: "3.3"
          bundler: "4.0.16"
          bundler-cache: false

      - name: Install the existing locked Fastlane dependencies
        run: bundle install --jobs 2 --retry 1

      - name: Prepare only the existing App Store Connect credential
        env:
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set +x
          umask 077
          ruby -rbase64 -rfileutils -e '
            path = ENV.fetch("APP_STORE_CONNECT_KEY_PATH")
            FileUtils.mkdir_p(File.dirname(path), mode: 0700)
            key = Base64.strict_decode64(ENV.fetch("APP_STORE_CONNECT_PRIVATE_KEY_BASE64"))
            abort("Empty App Store Connect credential") if key.empty?
            File.write(path, key, mode: "wb", perm: 0600)
          '

      - name: Verify the exact existing Apple build and public-link group
        id: preflight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set +x
          cat > "$RUNNER_TEMP/kira-beta-inspect.rb" <<'RUBY'
          require 'json'
          require 'spaceship'
          Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.create(
            key_id: ENV.fetch('APP_STORE_CONNECT_KEY_ID'), issuer_id: ENV.fetch('APP_STORE_CONNECT_ISSUER_ID'),
            filepath: ENV.fetch('APP_STORE_CONNECT_KEY_PATH'), duration: 1200, in_house: false
          )
          app = Spaceship::ConnectAPI::App.find('me.manga.kira')
          abort('Wrong App Store Connect application') unless app && app.id.to_s == '6792232678' && app.bundle_id == 'me.manga.kira'
          builds = Spaceship::ConnectAPI::Build.all(app_id: app.id, version: '1.0.7', build_number: '1',
            platform: Spaceship::ConnectAPI::Platform::IOS,
            includes: 'app,buildBetaDetail,preReleaseVersion,betaAppReviewSubmission')
          abort('Expected exactly one existing build 1.0.7 (1)') unless builds.length == 1
          build = builds.first
          abort('Existing build is not eligible') unless build.version == '1' && build.app_version == '1.0.7' && build.processing_state == 'VALID' && build.expired == false
          groups = app.get_beta_groups
          abort('Existing internal prerequisite group missing; refusing group creation') unless groups.any? { |g| g.is_internal_group == true }
          named = groups.select { |g| g.name == 'External Testing' }
          public_groups = groups.select { |g| g.is_internal_group == false && g.public_link_enabled == true }
          abort('Existing public-link group is missing or ambiguous; no groups/links will be created') unless named.length == 1 && public_groups.length == 1 && named.first.id == public_groups.first.id
          group = named.first
          abort('Invalid group identifier') unless group.id.match?(/\A[0-9a-fA-F-]{36}\z/)
          detail = build.build_beta_detail
          result = {
            app_store_id: app.id, bundle_id: app.bundle_id, version: build.app_version, build: build.version,
            build_id: build.id, processing_state: build.processing_state, expired: build.expired,
            group_id: group.id, group_name: group.name, public_link_enabled: group.public_link_enabled,
            group_assigned: group.fetch_builds.any? { |b| b.id == build.id },
            external_state: detail&.external_build_state,
            auto_notify_enabled: detail&.auto_notify_enabled,
            beta_review_state: build.beta_app_review_submission&.beta_review_state || 'NOT_SUBMITTED'
          }
          phase = ARGV.fetch(0)
          abort('Unsupported phase') unless %w[before after].include?(phase)
          base = File.join(ENV.fetch('RUNNER_TEMP'), 'kira-beta-reports')
          File.write(File.join(base, "#{phase}.json"), JSON.pretty_generate(result) + "\n", perm: 0600)
          if phase == 'before'
            File.open(ENV.fetch('GITHUB_ENV'), 'a') { |f| f.puts "KIRA_EXPECTED_TESTFLIGHT_GROUP_ID=#{group.id}" }
          end
          if phase == 'after'
            before = JSON.parse(File.read(File.join(base, 'before.json')))
            abort('Apple build/group identity changed') unless before['build_id'] == build.id && before['group_id'] == group.id
            abort('Existing build was not assigned to the public-link group') unless result[:group_assigned]
            abort('Automatic tester notification is not enabled') unless result[:auto_notify_enabled] == true
            accepted = %w[WAITING_FOR_BETA_REVIEW IN_BETA_REVIEW BETA_APPROVED IN_BETA_TESTING]
            abort('Apple external review/distribution was not accepted') unless accepted.include?(result[:external_state])
          end
          puts JSON.pretty_generate(result) # Deliberately excludes link URL, tester details and contacts.
          RUBY
          bundle exec ruby "$RUNNER_TEMP/kira-beta-inspect.rb" before

      - name: Submit the existing build to Beta Review and its existing external group
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TESTFLIGHT_FEEDBACK_EMAIL: ${{ secrets.TESTFLIGHT_FEEDBACK_EMAIL }}
          BETA_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.BETA_REVIEW_CONTACT_FIRST_NAME }}
          BETA_REVIEW_CONTACT_LAST_NAME: ${{ secrets.BETA_REVIEW_CONTACT_LAST_NAME }}
          BETA_REVIEW_CONTACT_EMAIL: ${{ secrets.BETA_REVIEW_CONTACT_EMAIL }}
          BETA_REVIEW_CONTACT_PHONE: ${{ secrets.BETA_REVIEW_CONTACT_PHONE }}
        run: |
          set +x
          bundle exec fastlane ios finalize_external

      - name: Read back actual review status and exact public-link membership
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set +x
          bundle exec fastlane ios record_testflight_status
          bundle exec ruby "$RUNNER_TEMP/kira-beta-inspect.rb" after

      - name: Preserve non-sensitive Apple status evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testflight-existing-1.0.7-1-status
          path: ${{ runner.temp }}/kira-beta-reports
          retention-days: 7
          if-no-files-found: warn

      - name: Remove owned credential and temporary dependencies
        if: ${{ always() }}
        run: |
          rm -rf -- "$RUNNER_TEMP/kira-beta-key" "$RUNNER_TEMP/kira-beta-gems"
          rm -f -- "$RUNNER_TEMP/kira-beta-inspect.rb" fastlane/report.xml
