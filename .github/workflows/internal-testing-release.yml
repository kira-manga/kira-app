name: Internal Testing Release

on:
  push:
    branches: [internal-testing]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to release
        required: true
        default: both
        type: choice
        options:
          - android
          - ios
          - both

permissions:
  contents: read
  packages: read

concurrency:
  group: kira-internal-testing-release
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate release request
    runs-on: ubuntu-latest
    steps:
      - name: Require the internal-testing branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/internal-testing" ]]; then
            echo '::error::Select the internal-testing branch before starting a release'
            exit 1
          fi

  checks:
    name: Shared app tests before either Store upload
    needs: validate-request
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (!contains(github.event.head_commit.message || '', '[skip both]') &&
           (!contains(github.event.head_commit.message || '', '[skip android]') ||
            !contains(github.event.head_commit.message || '', '[skip ios]'))) }}
    uses: ./.github/workflows/mobile-release-checks.yml
    secrets: inherit

  android:
    name: Android Internal Testing
    needs: [validate-request, checks]
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
           (inputs.platform == 'android' || inputs.platform == 'both')) ||
          (github.event_name == 'push' &&
           !contains(github.event.head_commit.message || '', '[skip android]') &&
           !contains(github.event.head_commit.message || '', '[skip both]')) }}
    uses: ./.github/workflows/android-internal-testing.yml
    secrets: inherit

  ios:
    name: iOS TestFlight
    needs: [validate-request, checks]
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
           (inputs.platform == 'ios' || inputs.platform == 'both')) ||
          (github.event_name == 'push' &&
           !contains(github.event.head_commit.message || '', '[skip ios]') &&
           !contains(github.event.head_commit.message || '', '[skip both]')) }}
    uses: ./.github/workflows/testflight.yml
    secrets: inherit
