name: App10 owned boot/listener diagnostic (bound diagnostic05)

on:
  push:
    branches: [remediation/app-10-boot-listener-diagnostic-05]

permissions:
  contents: read

concurrency:
  group: app10-mainactivity-cold-root
  cancel-in-progress: false

jobs:
  one-kvm-diagnostic:
    if: >-
      github.repository == 'kira-manga/kira-app' &&
      github.event.repository.private == false &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/remediation/app-10-boot-listener-diagnostic-05' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out only the event's controls carrier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: controls
          fetch-depth: 2
          persist-credentials: false

      - name: Check out the separately bound exact public App source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3fac0a7ba2c98001396e45857a7f6ab9ce1a5eb2
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the original public Engine source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: kira-manga/kira-source-engine
          ref: ed184165ebd3ee7f0d1db533cc40ca5a0868fdda
          path: engine
          fetch-depth: 1
          persist-credentials: false

      - name: One fresh KVM boot/listener/wake/menu/teardown diagnostic; no Gradle or APK
        id: cold_root
        working-directory: controls
        env:
          # Proposal literals are not admission. Primary must read/admit these exact controls.
          APP10_COLD_ROOT_ADMISSION: kira-app10-boot-listener-diagnostic-admitted-20260914-05
          APP10_COLD_ROOT_MODE: boot-listener-diagnostic
          # Dedicated ephemeral GitHub Ubuntu24 VM only; conditional provider0666 rule,
          # existing KVM node only, matching owned permission/rule restoration in final cleanup.
          APP10_KVM_PERMISSION_POLICY: github-hosted-ubuntu24-kvm-0666-owned-restore-v1
        run: exec python3 -B scripts/app10_cold_root.py

      - name: Retain only controller-owned bounded public reports, including failures
        if: always() && steps.cold_root.outputs.public_reports == 'ready'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app10-boot-listener-${{ github.sha }}-attempt1
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          path: |
            ${{ runner.temp }}/app10-cold-root-reports/result.json
            ${{ runner.temp }}/app10-cold-root-reports/inputs.json
            ${{ runner.temp }}/app10-cold-root-reports/commands.json
            ${{ runner.temp }}/app10-cold-root-reports/cleanup.json
            ${{ runner.temp }}/app10-cold-root-reports/adb-server.log
