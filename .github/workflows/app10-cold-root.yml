# PRIMARY-BOUND targeted validation; no deployment, Store upload, or duplicate host tests.
# Admission and all child controls independently read back before this single attempt.
name: Targeted Android APK, cold root and device validation

on:
  push:
    branches: [remediation/app-two-batch-shared-android-20260915-09]

permissions:
  contents: read

concurrency:
  group: app10-mainactivity-cold-root
  cancel-in-progress: false

jobs:
  one-shared-android:
    if: >-
      github.repository == 'kira-manga/kira-app' &&
      github.event.repository.private == false &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/remediation/app-two-batch-shared-android-20260915-09' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Check out only the event's controls carrier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: controls
          fetch-depth: 2
          persist-credentials: false

      - name: Check out the separately bound exact public App source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 826d7d2eecbcc8c2f834cc202d188898e41fd64f
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the original public Engine source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: kira-manga/kira-source-engine
          ref: ed184165ebd3ee7f0d1db533cc40ca5a0868fdda
          path: engine
          fetch-depth: 1
          persist-credentials: false

      - name: APK only with prior37 host passes carried, corrected fresh App10 UI first, then device9
        id: cold_root
        working-directory: controls
        env:
          APP10_COLD_ROOT_ADMISSION: 8ad1c9c2fd907e66cb836b47f5757cbc1ba304fcc7759bd16b21dfdec63c4396
          APP10_COLD_ROOT_MODE: shared-android
          # Dedicated ephemeral GitHub Ubuntu24 VM only; matching KVM restoration remains mandatory.
          APP10_KVM_PERMISSION_POLICY: github-hosted-ubuntu24-kvm-0666-owned-restore-v1
        run: exec python3 -B scripts/app10_cold_root.py

      - name: Retain only controller-owned bounded public reports, including failures
        if: always() && steps.cold_root.outputs.public_reports == 'ready'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app10-shared-android-${{ github.sha }}-attempt1
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          path: |
            ${{ runner.temp }}/app10-shared-android-reports/result.json
            ${{ runner.temp }}/app10-shared-android-reports/inputs.json
            ${{ runner.temp }}/app10-shared-android-reports/commands.json
            ${{ runner.temp }}/app10-shared-android-reports/cleanup.json
            ${{ runner.temp }}/app10-shared-android-reports/observations.json
            ${{ runner.temp }}/app10-shared-android-reports/adb-server.log
            ${{ runner.temp }}/app10-shared-android-reports/build.log
            ${{ runner.temp }}/app10-shared-android-reports/device-build.log
            ${{ runner.temp }}/app10-shared-android-reports/host-provenance.json
            ${{ runner.temp }}/app10-shared-android-reports/device-provenance.json
            ${{ runner.temp }}/app10-shared-android-reports/host-tests.json
            ${{ runner.temp }}/app10-shared-android-reports/device-tests.json
            ${{ runner.temp }}/app10-shared-android-reports/app-native.json
            ${{ runner.temp }}/app10-shared-android-reports/device-native.json
            ${{ runner.temp }}/app10-shared-android-reports/host-*.xml
            ${{ runner.temp }}/app10-shared-android-reports/device-*.xml
            ${{ runner.temp }}/app10-shared-android-reports/01-welcome.png
            ${{ runner.temp }}/app10-shared-android-reports/02-theme-optional.png
            ${{ runner.temp }}/app10-shared-android-reports/03-theme-denial.png
            ${{ runner.temp }}/app10-shared-android-reports/04-start-reading.png
            ${{ runner.temp }}/app10-shared-android-reports/05-first-library.png
            ${{ runner.temp }}/app10-shared-android-reports/06-cold-backfill.png
            ${{ runner.temp }}/app10-shared-android-reports/07-cold-library.png
