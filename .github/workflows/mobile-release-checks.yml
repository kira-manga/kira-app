name: Mobile release checks (no Store upload)

on:
  workflow_call:
  workflow_dispatch:
  # One bounded pre-integration validation branch; never uploads or uses signing credentials.
  push:
    branches: [remediation/app-61-gated-mobile-testing-20261016]

permissions:
  contents: read
  packages: read

concurrency:
  group: kira-mobile-release-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Existing shared tests and Android integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      KIRA_PACKAGES_USER: ${{ github.actor }}
      KIRA_SOURCE_CONFIG_BASE_URL: ${{ vars.KIRA_SOURCE_CONFIG_BASE_URL }}
      KIRA_SOURCE_CONFIG_PINNED_KEYS: ${{ vars.KIRA_SOURCE_CONFIG_PINNED_KEYS }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify pinned bootstrap inputs
        run: /usr/bin/ruby scripts/release/verify-toolchain-inputs.rb
      - name: Check release routing and upload safety
        run: |
          python3 -B scripts/check_transport_policy.py
          ruby scripts/release/tests/mobile-testing-workflow-test.rb
          ruby scripts/release/tests/ios-upload-only-workflow-test.rb
          ruby scripts/release/tests/google-play-open-testing-test.rb
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle without creating new shared caches
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Run existing shared, persistence, transport and Android tests in one batch
        env:
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: |
          trap './gradlew --stop' EXIT
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g \
            -Pkotlin.compiler.execution.strategy=in-process \
            :core:desktopTest :domain:desktopTest :data:desktopTest \
            :data:local:desktopTest :data:remote:desktopTest :data:download:desktopTest \
            :platform:desktopTest :presentation:desktopTest :composeApp:desktopTest \
            :ui:desktopTest :sources:engine:desktopTest :sources:config:desktopTest \
            :sources:legacy:desktopTest :app:testDebugUnitTest :app:testReleaseBundleIdentity \
            :ui:checkLocaleKeyParity :composeApp:checkLocaleKeyParity --stacktrace
      - name: Preserve test evidence even when a test fails
        id: preserve-evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-release-tests-${{ github.sha }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 7
      - name: Clean disposable build outputs
        if: ${{ always() && steps.preserve-evidence.outcome != 'failure' }}
        run: python3 -B scripts/release/clean-mobile-build.py
