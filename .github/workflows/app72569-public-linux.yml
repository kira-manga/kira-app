name: App7 Loader5 original Engine Android validation (bound exact5)

on:
  push:
    branches: [remediation/app-7-loader5-android-validation-01]

permissions:
  contents: read

concurrency:
  group: app7-loader5-android
  cancel-in-progress: false

jobs:
  android-host:
    if: >-
      github.repository == 'kira-manga/kira-app' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/remediation/app-7-loader5-android-validation-01' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the event carrier without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: app
          fetch-depth: 2
          persist-credentials: false

      - name: Check out the exact original public Engine source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: kira-manga/kira-source-engine
          ref: ed184165ebd3ee7f0d1db533cc40ca5a0868fdda
          path: engine
          fetch-depth: 1
          persist-credentials: false

      - name: Observe the normal Android graph and five literal Loader5 host methods
        working-directory: app
        env:
          # Primary binds this literal only after independent actual-control review.
          # The new carrier directly extends bound source; only five controls differ from source.
          APP72569_ADMISSION: fd1099944a7e686d7a0245cb81bdea3848257b5c38e0e16d5fd583e497b7fde3
        run: python3 -B scripts/validate_app72569_linux.py

      - name: Retain only bounded public reports, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app7-loader5-android-${{ github.sha }}-attempt1
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
          path: |
            ${{ runner.temp }}/app7-loader5-android-reports/result.json
            ${{ runner.temp }}/app7-loader5-android-reports/source-before.json
            ${{ runner.temp }}/app7-loader5-android-reports/source-after.json
            ${{ runner.temp }}/app7-loader5-android-reports/commands.json
            ${{ runner.temp }}/app7-loader5-android-reports/inputs.json
            ${{ runner.temp }}/app7-loader5-android-reports/android-provenance.json
            ${{ runner.temp }}/app7-loader5-android-reports/gradle.log
            ${{ runner.temp }}/app7-loader5-android-reports/inputs.log
            ${{ runner.temp }}/app7-loader5-android-reports/stop-immediate.log
            ${{ runner.temp }}/app7-loader5-android-reports/stop-final.log
            ${{ runner.temp }}/app7-loader5-android-reports/TEST-me.manga.kira.core.util.notification.NotificationCoverLoaderTest.xml
