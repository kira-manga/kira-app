name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name'
        required: true
        default: '1.0.37'
      skip_build:
        description: 'Skip build (use cached APK)'
        type: boolean
        default: false
      skip_release:
        description: 'Skip release creation'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_build }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_NATIVE_ID: ${{ secrets.ADMOB_NATIVE_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --parallel --build-cache --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !inputs.skip_release && !cancelled() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-build

      - name: Get Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION_NAME=${GITHUB_REF#refs/tags/v}
          else
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | awk '{print $3}')
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Yami Manga v${{ steps.version.outputs.version_name }}
          body: |
            ## 🚀 Yami Manga v${{ steps.version.outputs.version_name }}
            📱 Version ${{ steps.version.outputs.version_name }} (Build ${{ steps.version.outputs.version_code }})
          files: app-release.apk

  artifact:
    name: Save Artifact
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() }}

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-build

      - name: Get Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION_NAME=${GITHUB_REF#refs/tags/v}
          else
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YamiManga-v${{ steps.version.outputs.version_name }}
          path: app-release.apk
          retention-days: 30