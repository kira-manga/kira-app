<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yami — Home (current)</title>
<style>
  /* ===== Faithful reconstruction of the CURRENT Home (:ui HomeScreen + YamiColors dark) ===== */
  :root{
    --bg:#15202B;            /* YamiDarkColorScheme.background (Twitter night blue) */
    --on-bg:#E3E2E6;
    --surface:#15202B;
    --card:#1B2A38;          /* surface + faked M3 elevation tint */
    --on-surface:#E3E2E6;
    --on-surface-variant:#C4C6D0;
    --primary:#B0C6FF;
    --primary-container:#00429B;
    --on-primary-container:#D7E2FF;
    --secondary-container:#00429B;
    --outline:#8E9099;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{font-family:-apple-system,"Segoe UI",Roboto,Inter,sans-serif}
  .screen{width:390px;height:880px;position:relative;overflow:hidden;background:var(--bg);color:var(--on-bg)}
  .statusbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:13px;font-weight:600;color:var(--on-bg)}
  .statusbar .dots{display:flex;gap:5px;align-items:center;opacity:.9}
  .statusbar .dots span{display:inline-block}
  /* top app bar */
  .appbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;background:var(--bg)}
  .appbar h1{font-size:24px;font-weight:700;color:var(--on-bg)}
  .appbar .actions{display:flex;align-items:center}
  .iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;color:var(--on-bg)}
  .iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
  /* source tabs */
  .tabs{height:48px;display:flex;align-items:center;gap:0;padding:0 8px;overflow:hidden}
  .tab{display:flex;align-items:center;gap:6px;padding:6px 12px;margin:0 8px;border-radius:12px;font-size:13px;font-weight:500;color:rgba(227,226,230,.6);white-space:nowrap}
  .tab .ic{width:18px;height:18px;border-radius:4px;background:rgba(227,226,230,.25)}
  .tab.sel{background:rgba(176,198,255,.10);color:var(--primary)}
  .tab.sel .ic{background:var(--primary)}
  .tabs .edit{margin-left:auto;color:var(--on-bg);flex:0 0 auto}
  .tabs .edit svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
  /* carousel */
  .sec-gap{height:8px}
  .carousel{display:flex;gap:16px;padding:6px 12px;overflow:hidden}
  .cover{position:relative;border-radius:12px;overflow:hidden;flex:0 0 auto;box-shadow:0 6px 12px rgba(0,0,0,.45)}
  .cover .art{width:100%;height:100%;position:absolute;inset:0}
  .cover .scrim{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(transparent,rgba(0,0,0,.8))}
  .cover .t{position:absolute;left:8px;right:8px;bottom:8px;color:#fff;font-size:12px;font-weight:700;line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .carousel .cover{width:150px;height:220px}
  /* feed rows */
  .feed{padding:8px 0 0}
  .row{display:flex;margin:8px;padding:8px;background:var(--card);border-radius:8px;box-shadow:0 6px 14px rgba(0,0,0,.45)}
  .row .rcover{width:100px;height:130px;border-radius:6px;overflow:hidden;flex:0 0 auto;position:relative}
  .row .body{flex:1;padding-left:12px;min-width:0;display:flex;flex-direction:column}
  .row .title{font-size:16px;font-weight:700;color:var(--on-surface);line-height:1.2;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .chips{margin-top:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .chip{background:var(--primary-container);color:var(--on-primary-container);font-size:10px;font-weight:500;padding:4px 8px;border-radius:6px;box-shadow:0 4px 8px rgba(0,0,0,.4)}
  .row .save{margin-left:auto;align-self:flex-end;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--on-surface-variant)}
  .row .save svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
  .row .rgroup{display:flex;flex:1;align-items:flex-end}
  /* bottom nav (M3 NavigationBar) */
  .nav{position:absolute;left:0;right:0;bottom:0;height:74px;background:#16222F;border-top:1px solid rgba(227,226,230,.12);display:flex;align-items:center;justify-content:space-around;padding-bottom:8px}
  .nav .item{display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(227,226,230,.6);font-size:11px;font-weight:500;flex:1}
  .nav .item .pill{width:56px;height:30px;border-radius:16px;display:flex;align-items:center;justify-content:center}
  .nav .item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
  .nav .item.sel{color:var(--primary)}
  .nav .item.sel .pill{background:rgba(0,66,155,.55)}
  /* cover gradients */
  .g1{background:linear-gradient(150deg,#3a4a63,#202b3a)}
  .g2{background:linear-gradient(150deg,#5b3a4a,#2a2030)}
  .g3{background:linear-gradient(150deg,#3a5b52,#1f2e2a)}
  .g4{background:linear-gradient(150deg,#534a8c,#262238)}
  .g5{background:linear-gradient(150deg,#8c6a3a,#322714)}
  .g6{background:linear-gradient(150deg,#3a6a8c,#142a33)}
</style>
</head>
<body>
