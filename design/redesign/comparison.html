<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Yami — Home: old vs new</title>
<style>
  *{margin:0;box-sizing:border-box}
  body{background:#0B0D11;color:#F3F4F7;font-family:-apple-system,"Segoe UI",Roboto,Inter,sans-serif;padding:30px 34px}
  h1{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
  .sub{font-size:13px;color:#9AA1AF;margin-bottom:24px}
  .grid{display:flex;gap:28px;align-items:flex-start}
  .col{width:300px}
  .cap{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .cap .tag{font-size:11px;font-weight:800;letter-spacing:.5px;padding:4px 10px;border-radius:999px}
  .old{background:#28323e;color:#AEB6C2}
  .new{background:linear-gradient(135deg,#FF5B6E,#FF8A5B);color:#fff}
  .cap .d{font-size:12px;color:#838B9A}
  .frame{border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.09);box-shadow:0 22px 50px rgba(0,0,0,.55)}
  .frame img{display:block;width:300px}
</style></head>
<body>
  <h1>Yami — Home: current vs redesign</h1>
  <div class="sub">Review-gate result: 5/5 reviewers → adopt new (dark preferred), distinct from old. All Home features preserved.</div>
  <div class="grid">
    <div class="col"><div class="cap"><span class="tag old">CURRENT</span><span class="d">Material-3, blue</span></div><div class="frame"><img src="renders/home-old.png"></div></div>
    <div class="col"><div class="cap"><span class="tag new">NEW · DARK</span><span class="d">signature / default</span></div><div class="frame"><img src="renders/home-new-v2.png"></div></div>
    <div class="col"><div class="cap"><span class="tag new">NEW · LIGHT</span><span class="d">ref #12 showcase</span></div><div class="frame"><img src="renders/home-new-light-v2.png"></div></div>
  </div>
</body></html>
