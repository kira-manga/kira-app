// Public derivative of the reviewed Engine02 normal-action observer; no replacement build.
import groovy.json.JsonSlurper
import java.security.MessageDigest
import org.gradle.api.GradleException
import org.gradle.api.tasks.testing.AbstractTestTask
import org.gradle.api.tasks.testing.Test

def require = { ok, message -> if (!ok) throw new GradleException(message.toString()) }
def bindingPath = System.getenv('KIRA_ORIGINAL_ENGINE_BINDING')
def bindingSha = System.getenv('KIRA_ORIGINAL_ENGINE_BINDING_SHA256')
require(bindingPath && bindingSha, 'No direct/unbound observer invocation')
def bindingFile = new File(bindingPath)
require(bindingFile.isFile() && bindingFile.canonicalPath == bindingFile.absolutePath, 'Nonaliased runtime binding required')
def bytes = bindingFile.withInputStream { it.readNBytes(65537) }
require(bytes.length <= 65536 && MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() == bindingSha,
    'Exact bounded runtime source/control binding required')
def binding = new JsonSlurper().parseText(new String(bytes, 'UTF-8'))
require(binding.status == 'PRIMARY_BOUND_FOR_REVIEW' && binding.contract == 'app72569-public-linux-original-engine02' &&
    binding.app.head == '7f9e49067acfd5c7f6eeb1a08550b98562d68c63' &&
    binding.app.tree == 'ff103c613e95aae853e929507f540c167edd3df7' &&
    binding.engine.commit == 'ed184165ebd3ee7f0d1db533cc40ca5a0868fdda' &&
    binding.engine.tree == '14e46a1ead24b5757d612fd55031e440f5304661', 'Wrong public source identities')
require(binding.app.repo == 'app' && binding.engine.source_path == 'engine' && binding.test.max_heap == '1g' &&
    binding.test.task == ':app:testDebugUnitTest' && binding.test.cases.size() == 40, 'Exact union40 host binding required')
def workspace = new File(System.getenv('KIRA_ORIGINAL_ENGINE_WORKSPACE')).canonicalFile
def appRoot = new File(workspace, 'app')
def engineRoot = new File(workspace, 'engine')
def modules = [':core', ':domain', ':presentation', ':ui', ':platform', ':data:local', ':data:remote', ':sources:legacy',
    ':sources:contracts', ':data:download', ':data', ':sources:engine', ':sources:config', ':composeApp']
def c = [binding: binding, appRoot: appRoot, engineRoot: engineRoot, buildName: 'original-engine-ed184165-android01',
    group: 'me.manga.kira.source', engineModules: [':source-contract', ':source-engine'],
    testPath: ':app:testDebugUnitTest', role: null, logger: logger]
gradle.ext.app72569Context = c
apply from: new File(appRoot, 'scripts/app72569-observer.gradle'), to: gradle
def o = gradle.ext.app72569Observer
def appCompilers = modules.collect { it + ':compileAndroidMain' } + [':app:compileDebugKotlin', ':app:compileDebugUnitTestKotlin']
def engineCompilers = c.engineModules.collect { it + ':compileAndroidMain' }
def room = ':data:local:kspAndroidMain'
def resources = [':ui:convertXmlValueResourcesForCommonMain', ':ui:generateResourceAccessorsForCommonMain',
    ':ui:generateComposeResClass', ':composeApp:convertXmlValueResourcesForCommonMain',
    ':composeApp:generateResourceAccessorsForCommonMain', ':composeApp:generateComposeResClass', ':composeApp:generateSourceRemoteConfig']
def taskArguments = [c.testPath] + binding.test.cases.collectMany { ['--tests', it.class_name + '.' + it.method] }
def outgoing = []

def checkStartParameters = {
    require(gradle.gradleVersion == '9.6.1' && System.getProperty('java.specification.version') == '21' &&
        !gradle.startParameter.offline && !gradle.startParameter.dryRun && gradle.startParameter.excludedTaskNames.empty &&
        gradle.startParameter.maxWorkerCount == 1 && !gradle.startParameter.parallelProjectExecutionEnabled &&
        !gradle.startParameter.buildCacheEnabled && !gradle.startParameter.configurationCacheRequested,
        'One-worker/no-cache Gradle9.6.1/JDK21 with ordinary public dependency resolution only')
}
gradle.settingsEvaluated { settings ->
    def root = settings.settingsDir.canonicalFile
    require(root == appRoot || root == engineRoot, 'Only the exact public app and original Engine builds')
    c.role = root == appRoot ? 'app' : 'engine'
    checkStartParameters()
    if (c.role == 'app') {
        require(gradle.startParameter.taskNames == taskArguments, 'The forty literal app methods are the sole root')
        settings.includeBuild(engineRoot) {
            name = c.buildName
            dependencySubstitution {
                substitute(module('me.manga.kira.source:source-engine:0.1.0')).using(project(':source-engine'))
            }
        }
    } else {
        require(settings.rootProject.name == 'kira-source-engine', 'Do not rename the original producer settings')
    }
    o.emit('SETTINGS', [root: root.path, requested: gradle.startParameter.taskNames,
        maxWorkers: gradle.startParameter.maxWorkerCount, offline: gradle.startParameter.offline,
        includedName: c.buildName, sourceTree: binding.engine.tree, declaredKgp: c.role == 'app' ? '2.4.0' : '2.2.21'])
}
gradle.projectsEvaluated {
    def included = gradle.includedBuilds.collect { [name: it.name, root: it.projectDir.canonicalPath] }
    require(included == (c.role == 'app' ? [[name: c.buildName, root: engineRoot.path]] : []), 'No other composite or recursive build')
    if (c.role == 'engine') {
        require(gradle.rootProject.subprojects*.path.toSet() == [':source-contract', ':source-engine', ':source-testkit'].toSet(),
            'Keep all three original modules')
        gradle.rootProject.allprojects.each { p ->
            require(p.group.toString() == c.group && p.version.toString() == '0.1.0-SNAPSHOT', 'Original group/default version only')
            if (p.path != ':') {
                def targets = p.extensions.getByName('kotlin').targets.collect { [name: it.name, type: it.class.name] }
                require(targets*.name.toSet() == ['metadata', 'android', 'jvm', 'iosArm64', 'iosSimulatorArm64'].toSet(),
                    'No original target pruning')
                o.emit('PRODUCER_MODEL', [project: p.path, version: p.version.toString(), targets: targets])
            }
        }
    }
}

def compileConfiguration = { p, task ->
    def config = task.path == ':app:compileDebugKotlin' ? 'debugCompileClasspath' :
        (task.path == ':app:compileDebugUnitTestKotlin' ? 'debugUnitTestCompileClasspath' : null)
    if (config == null) {
        def main = p.extensions.getByName('kotlin').targets.getByName('android').compilations.getByName('main')
        require(main.compileTaskProvider.get() == task, 'Observe only the actual normal Android main compiler')
        config = main.compileDependencyConfigurationName
        require(config == 'androidCompileClasspath', 'Unexpected normal Android main compile configuration: ' + config)
    }
    config
}
def observeCompiler = { p, task ->
    require(p.findProperty('kotlin.compiler.execution.strategy') == 'in-process', 'Both builds use in-process Kotlin')
    def strategy = task.compilerExecutionStrategy.get().toString()
    require(strategy in ['IN_PROCESS', 'in-process'], 'Observe actual compiler execution strategy, not CLI intent')
    def options = task.compilerOptions
    require(options.jvmTarget.get().target == '11', 'Ordinary Android JVM11 compiler target')
    def files = (task.hasProperty('sources') ? task.sources : task.source).files.findAll { it.name.endsWith('.kt') }
    def sources = files.collect { [path: it.canonicalPath, sha256: o.sha(it)] }.sort { it.path }
    if (c.role == 'engine') {
        def wanted = binding.engine.common_main.findAll { it.path.startsWith(p.name + '/src/commonMain/') }
            .collect { [path: new File(engineRoot, it.path).path, sha256: it.sha256] }.sort { it.path }
        require(sources == wanted, 'Both original Android mains must compile every pinned commonMain source, no subset')
        require(options.languageVersion.get().version == '2.1' && options.apiVersion.get().version == '2.1',
            'Keep original producer language/API2.1')
    }
    o.emit('COMPILER_INPUT', [task: task.path, type: task.class.name, strategy: strategy,
        jvmTarget: options.jvmTarget.get().target, language: options.languageVersion.orNull?.version,
        api: options.apiVersion.orNull?.version, sources: c.role == 'engine' ? sources : null,
        sourceCount: sources.size(), actions: task.actions.collect { it.class.name }])
    o.observeResolution(p, task, compileConfiguration(p, task), 'java-api')
    o.observeClasspath(task, task.libraries.files, 'compiler')
}
gradle.beforeProject { p ->
    p.configurations.configureEach { config ->
        config.resolutionStrategy.dependencySubstitution.all { details -> o.rejectRequest(details.requested) }
    }
    p.tasks.configureEach { task ->
        if (task.path in (c.role == 'app' ? appCompilers : engineCompilers)) task.doFirst { observeCompiler(p, task) }
    }
    p.tasks.withType(Test).configureEach { t ->
        t.filter.failOnNoMatchingTests = true
        t.systemProperty('junit.jupiter.execution.parallel.enabled', 'false')
        t.systemProperty('java.awt.headless', 'true')
        t.systemProperty('java.io.tmpdir', System.getenv('TMPDIR'))
        t.systemProperty('user.home', System.getenv('HOME'))
        t.doFirst { o.observeTest(t) }
    }
}

def validateGraph = { graph ->
    def tasks = graph.allTasks
    def compilers = c.role == 'app' ? appCompilers + [room] : engineCompilers
    def observed = c.role == 'app' ? resources + [binding.host_runtime.stage_task, c.testPath] : []
    o.emit('GRAPH', [root: gradle.rootProject.projectDir.canonicalPath, requested: gradle.startParameter.taskNames,
        tasks: tasks.collect { [path: it.path, type: it.class.name] }])
    require(tasks*.path.containsAll(compilers + observed), 'Keep normal full Android compile/resource/Room/host closure')
    require(tasks.findAll { it.name in ['compileAndroidMain', 'compileDebugKotlin', 'compileDebugUnitTestKotlin', 'kspAndroidMain']
        }*.path.toSet() == compilers.toSet(), 'No omitted/additional Android main/test/Room compiler')
    require(tasks.every { it.project.path in (c.role == 'app' ? modules + [':app'] : c.engineModules) }, 'No unselected module/testkit task')
    require(tasks.findAll { it instanceof AbstractTestTask }*.path == (c.role == 'app' ? [c.testPath] : []), 'Only the literal app Test task')
    require(!tasks.any {
        def n = it.name.toLowerCase(Locale.ROOT)
        n.contains('desktop') || n.contains('ios') || n.contains('cinterop') || n.contains('framework') ||
            n.contains('commoniz') || n.contains('kotlinmetadata') || n.contains('kotlinjvm') ||
            n.contains('ktlint') || n.contains('detekt') || n.contains('publish') ||
            n.startsWith('assemble') || n.startsWith('install') || n.startsWith('sign') ||
            n.contains('download') || n == 'checklocalekeyparity'
    }, 'Unexpected non-Android/provisioning/publishing graph: stop, do not prune or force it')
}
gradle.taskGraph.whenReady { graph ->
    validateGraph(graph)
    if (c.role == 'engine') outgoing = o.collectOutgoing(gradle.rootProject, graph)
}
gradle.taskGraph.afterTask { task, state ->
    def compilers = c.role == 'app' ? appCompilers + [room] : engineCompilers
    def observed = c.role == 'app' ? resources + [binding.host_runtime.stage_task, c.testPath] : []
    if (task.path in compilers || task.path in observed || outgoing.any { task.path in it.producers }) {
        def row = [path: task.path, type: task.class.name, executed: state.executed, didWork: state.didWork,
            skipped: state.skipped, upToDate: state.upToDate, noSource: state.noSource, failure: state.failure?.class?.name]
        if (c.role == 'engine' && task.path in engineCompilers && state.failure == null) {
            row.outputs = task.outputs.files.files.findAll { it.exists() }.collect { o.fileRow(it) }
        }
        if (task.path == room && state.failure == null) row.roomSources = task.outputs.files.asFileTree.files.findAll {
            it.name in ['MangaDatabase_Impl.kt', 'MangaDatabase_Impl.java', 'ChapterDownloadDao_Impl.kt', 'ChapterDownloadDao_Impl.java']
        }.collect { [path: it.canonicalPath, sha256: o.sha(it)] }
        o.emit(task.path in compilers ? 'COMPILE_COMPLETE' : 'TASK_COMPLETE', row)
        outgoing.findAll { task.path in it.producers }.each { artifact ->
            if (new File(artifact.path).exists()) o.emit('ARTIFACT', artifact + [producer: task.path, file: o.fileRow(new File(artifact.path))])
        }
    }
}
