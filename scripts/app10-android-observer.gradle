        def outputs = candidate == null ? [] : candidate.outputs.files.files.toList()
        def destination = candidate != null && spec.name == 'compileDebugUnitTestJavaWithJavac' &&
            candidate.class.name == spec.type ? candidate.destinationDirectory.orNull?.asFile : null
        def isKsp = candidate != null && spec.name == 'kspDebugUnitTestKotlin' && candidate.class.name == spec.type
        def resource = isKsp ? candidate.kspConfig.resourceOutputDir.orNull?.asFile : null
        def classOutput = isKsp ? candidate.kspConfig.classOutputDir.orNull?.asFile : null
        def processors = isKsp ? task.project.configurations.findByName('kspDebugUnitTestKotlinProcessorClasspath') : null
        require(outputs.size() <= 8, 'Test prerequisite output count exceeds diagnostic bound: ' + spec.name)
        require(outputs.every { it.absolutePath.length() <= 2048 && it.canonicalPath.length() <= 2048 },
            'Test prerequisite output path exceeds diagnostic bound: ' + spec.name)
        require(destination == null || (destination.absolutePath.length() <= 2048 && destination.canonicalPath.length() <= 2048),
            'Test Java destination path exceeds diagnostic bound')
        require(resource == null || (resource.absolutePath.length() <= 2048 && resource.canonicalPath.length() <= 2048),
            'Test KSP resource path exceeds diagnostic bound')
        require(classOutput == null || (classOutput.absolutePath.length() <= 2048 && classOutput.canonicalPath.length() <= 2048),
            'Test KSP class-output path exceeds diagnostic bound')
