    require(c.role == 'app' && task.path == ':app:testDebugUnitTest' && c.testSpecs.containsKey(task.path) &&
        task.class.name == 'com.android.build.gradle.tasks.factory.AndroidUnitTest_Decorated', 'Only the exact Android Test absent-input exception')
