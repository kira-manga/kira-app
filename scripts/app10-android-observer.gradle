def dependenciesOf = { graph, producer ->
    def pending = [producer]
    def seen = [] as Set
    while (!pending.isEmpty()) {
        def current = pending.remove(0)
        if (seen.add(current.path)) {
            def dependencies = current.taskDependencies.getDependencies(current)
            require(dependencies.every { graph.hasTask(it) }, 'Observe only tasks in the actual producer graph')
            pending.addAll(dependencies)
        }
    }
    seen.sort()
}
def outgoingVariants = { p ->
    p.configurations.findAll { config -> config.canBeConsumed &&
        attrValue(config.attributes, 'org.jetbrains.kotlin.platform.type') in c.mains.keySet() &&
        attrValue(config.attributes, 'org.gradle.usage') in ['java-api', 'java-runtime'] }.collectMany { config ->
        [[name: config.name, attributes: attrs(config.attributes), artifacts: config.outgoing.artifacts]] +
            config.outgoing.variants.collect { v -> [name: config.name + '/' + v.name,
                attributes: attrs(config.attributes) + attrs(v.attributes), artifacts: v.artifacts] }
    }
}
def collectOutgoing = { rootProject, graph ->
    def outgoing = []
    c.engineModules.each { module ->
        outgoingVariants(rootProject.project(module)).each { variant -> variant.artifacts.each { artifact ->
            def producers = artifact.buildDependencies.getDependencies(null)
            if (producers && producers.every { graph.hasTask(it) }) {
                def platform = variant.attributes['org.jetbrains.kotlin.platform.type'].value
                def dependencies = producers.collectMany { dependenciesOf(graph, it) }.toSet().sort()
                def candidate = [project: module, platform: platform, variant: variant.name, attributes: variant.attributes,
                    artifactType: artifact.type, classifier: artifact.classifier, extension: artifact.extension,
                    path: artifact.file.canonicalPath, producers: producers*.path.sort(), producerDependencyPaths: dependencies]
                emit('OUTGOING_CANDIDATE', candidate)
                // Auxiliary metadata/resources get diagnostics, never neutral provenance credit.
                if (dependencies.contains(module + ':' + c.mains[platform].engine)) outgoing.add(candidate)
            }
        } }
    }
    require(c.engineModules.every { m -> c.mains.keySet().every { p -> outgoing.any { it.project == m && it.platform == p } } },
        'Ordinary compiler-backed outgoing artifacts required separately for both modules/platforms')
    emit('OUTGOING', [artifacts: outgoing])
