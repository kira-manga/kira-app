    }
    // Record the actual absent path before a failed equality check can hide it again.
    c.logger.lifecycle('APP72569_ABSENT_TEST_INPUT ' + JsonOutput.toJson([input: f.absolutePath,
        candidates: candidates.collect { row ->
            def candidate = row.task
            def state = candidate?.state
            [expected: row.spec.name, path: candidate?.path, type: candidate?.class?.name,
             inGraph: candidate != null && graph.hasTask(candidate),
             outputs: row.outputs.collect { [path: it.absolutePath, canonical: it.canonicalPath] },
             destination: row.destination?.absolutePath,
             resource: row.resource == null ? null : [path: row.resource.absolutePath, canonical: row.resource.canonicalPath],
             classOutput: row.classOutput == null ? null : [path: row.classOutput.absolutePath, canonical: row.classOutput.canonicalPath],
             processorConfiguration: row.processors?.name, processorConfigurationState: row.processors?.state?.toString(),
             enabled: candidate?.enabled,
             executed: state?.executed, didWork: state?.didWork, skipped: state?.skipped,
             upToDate: state?.upToDate, noSource: state?.noSource, failure: state?.failure?.class?.name]
        }]))
    def matches = candidates.findAll { row -> row.outputs.any {
        it.absolutePath == f.absolutePath && it.canonicalPath == f.canonicalPath
    } }
    require(matches.size() == 1, 'Absent Test input must equal one exact declared Java resource/compiler or KSP resource/class output: ' + f.absolutePath)
    def selected = matches[0]
    def producer = selected.task
    require(producer != null && producer.path == ':app:' + selected.spec.name && producer.class.name == selected.spec.type &&
        graph.hasTask(task) && graph.hasTask(producer) && testDependsOn(task, producer, graph), 'Only the exact normal Test prerequisite')
    if (selected.spec.name == 'compileDebugUnitTestJavaWithJavac') {
        require(selected.destination != null && selected.destination.absolutePath == f.absolutePath &&
            selected.destination.canonicalPath == f.canonicalPath, 'Absent Test input must be the actual Java compile destination')
    }
    def state = producer.state
    def kspProof = [:]
    def reason = selected.spec.reason
    if (selected.spec.name == 'kspDebugUnitTestKotlin') {
        // Only the two pinned KSP output providers that can reach this Test classpath.
        // Declared ownership alone does not authorize Java/Kotlin/cache or other absent outputs.
        def outputMatches = [
            [kind: 'resource', file: selected.resource, key: 'resourceOutput'],
            [kind: 'class', file: selected.classOutput, key: 'classOutput'],
        ].findAll { output -> output.file != null && output.file.absolutePath == f.absolutePath &&
            output.file.canonicalPath == f.canonicalPath }
        require(outputMatches.size() == 1, 'Absent Test input must equal one actual KSP resource/class output provider')
        def output = outputMatches[0]
        require(producer.enabled && state.executed && state.skipped && state.failure == null &&
            !state.didWork && !state.upToDate && !state.noSource, 'Only an enabled completed no-work KSP skip')
        def processors = selected.processors
        require(processors != null && processors.state.toString() == 'RESOLVED',
            'Only the already-resolved exact KSP processor configuration')
        // KSP2.3.9 registerKspAATask uses this configuration's artifact files for both
        // onlyIf(!incomingProcessors.isEmpty) and kspConfig.processorClasspath.
        // Read the existing resolved model; never invoke onlyIf or create/resolve an artifact view.
        def dependencyCount = processors.allDependencies.size()
        require(dependencyCount == 0, 'Only an empty declared KSP processor model: dependencyCount=' + dependencyCount)
        def processorFileCount = producer.kspConfig.processorClasspath.files.size()
        require(processorFileCount == 0, 'Only an empty actual KSP processor classpath: fileCount=' + processorFileCount)
        kspProof = [enabled: producer.enabled, outputKind: output.kind,
            processorConfiguration: processors.name, processorConfigurationState: processors.state.toString(),
            processorDependencyCount: dependencyCount, processorFileCount: processorFileCount]
        kspProof[output.key] = output.file.absolutePath
        reason = 'successful-empty-processor-ksp-' + output.kind + '-output'
    } else {
        require(state.executed && state.noSource && state.failure == null && !state.didWork && !state.upToDate,
            'Only a completed successful NO-SOURCE Java resource/compiler producer: ' + producer.path)
    }
    [path: f.absolutePath, kind: 'absent', bytes: null, sha256: null, neutralClasses: [:],
     reason: reason,
     producer: [build: c.role, path: producer.path, type: producer.class.name, output: f.absolutePath,
        executed: state.executed, didWork: state.didWork, skipped: state.skipped, upToDate: state.upToDate,
        noSource: state.noSource, failure: state.failure?.class?.name] + kspProof]
}
def testClasspathRow = { task, File f ->
    if (task.path == ':app:testDebugUnitTest') return appTestClasspathRow(task, f)
    if (!Files.notExists(f.toPath(), LinkOption.NOFOLLOW_LINKS)) return fileRow(f)
    require(c.role == 'app' && c.testSpecs.containsKey(task.path) && c.testSpecs[task.path].platform == 'androidJvm' &&
        task.class.name == 'com.android.build.gradle.tasks.factory.AndroidUnitTest_Decorated', 'Only the exact Android Test resource exception')
    require(f.canonicalPath == f.absolutePath, 'Aliased absent Test input: ' + f.absolutePath)
    for (File ancestor = f; ancestor != null; ancestor = ancestor.parentFile) {
        require(!Files.isSymbolicLink(ancestor.toPath()), 'Symlink in absent Test input: ' + ancestor.absolutePath)
    }
    def producer = task.project.tasks.findByName(c.testSpecs[task.path].host_runtime.resource_task)
    def graph = task.project.gradle.taskGraph
    require(producer != null && producer.path == task.project.path + ':' + c.testSpecs[task.path].host_runtime.resource_task &&
        producer.class.name == 'com.android.build.gradle.internal.tasks.ProcessJavaResTask_Decorated' &&
        graph.hasTask(task) && graph.hasTask(producer) && testDependsOn(task, producer, graph), 'Only the exact normal Test resource prerequisite')
    require(producer.outputs.files.files.any { it.absolutePath == f.absolutePath &&
        it.canonicalPath == f.canonicalPath }, 'Absent Test input must equal an actual declared resource output')
    def state = producer.state
    require(state.executed && state.noSource && state.failure == null && !state.didWork && !state.upToDate,
        'Only a completed successful NO-SOURCE resource producer')
    [path: f.absolutePath, kind: 'absent', bytes: null, sha256: null, neutralClasses: [:],
     reason: 'successful-no-source-java-resource-output',
     producer: [build: c.role, path: producer.path, type: producer.class.name, output: f.absolutePath,
        executed: state.executed, didWork: state.didWork, skipped: state.skipped, upToDate: state.upToDate,
        noSource: state.noSource, failure: state.failure?.class?.name]]
}
def rejectRequest = { selector ->
    if (selector instanceof ModuleComponentSelector && selector.group == c.group) {
        require(selector.module == 'source-engine' && selector.version == '0.1.0',
            'Only the exact Engine root request; contract must follow its ordinary project edge')
    }
}
def neutralEdge = { edge, usage, platform, rootId ->
    rejectRequest(edge.requested)
    if (!(edge instanceof ResolvedDependencyResult) || edge.selected.moduleVersion?.group != c.group) return null
    def id = edge.selected.id
    require(id instanceof ProjectComponentIdentifier && id.projectPath in c.engineModules &&
        (c.role == 'app' ? id.build.buildPath == ':' + c.buildName : id.build.buildPath == rootId.build.buildPath),
        'No neutral binary, foreign build/project, testkit or App-contract substitution')
    def variant = edge.resolvedVariant
    require(attrValue(variant.attributes, 'org.jetbrains.kotlin.platform.type') == platform &&
        attrValue(variant.attributes, 'org.gradle.usage') == usage &&
        attrValue(variant.attributes, 'org.gradle.category') == 'library', 'Genuine platform API/runtime library variant required')
    def suffix = platform == 'androidJvm' ? '-android' : '-jvm'
    require(edge.selected.moduleVersion.version == '0.1.0-SNAPSHOT' && variant.capabilities.any {
        it.group == c.group && it.version == '0.1.0-SNAPSHOT' &&
            it.name in [id.projectPath.substring(1), id.projectPath.substring(1) + suffix]
    }, 'Original effective version and actual target capability required')
    [from: component(edge.from.id), requested: edge.requested.displayName, selected: component(id),
     effectiveVersion: edge.selected.moduleVersion.version, variant: variant.displayName,
     attributes: attrs(variant.attributes), capabilities: caps(variant)]
}
def observeAvif = { task, configuration ->
    def coordinate = c.binding.avif.coordinate.tokenize(':')
    def ids = configuration.incoming.resolutionResult.allComponents*.id.findAll {
        it instanceof ModuleComponentIdentifier && it.group == coordinate[0] && it.module == coordinate[1]
    }
    if (ids.isEmpty()) return
    require(ids.size() == 1 && ids[0].version == coordinate[2], 'No old/new AVIF resolution or version fallback')
    // Filter the already-selected component BEFORE resolving artifacts. A broad legacy artifact
    // query needlessly selects ambiguous AGP project artifacts unrelated to this original AAR.
    // Same resolved configuration, strict view; no attribute mutation, forcing or detached graph.
    def artifacts = configuration.incoming.artifactView {
        componentFilter { id -> id == ids[0] }
    }.artifacts.artifacts.toList()
    require(artifacts.size() == 1 && artifacts[0].id.componentIdentifier == ids[0] &&
        artifacts[0].file.name.endsWith('.aar'), 'One genuine original AAR artifact required')
    def f = artifacts[0].file
    require(f.canonicalPath == f.absolutePath && f.isFile() && f.length() == c.binding.avif.aar.bytes &&
        sha(f) == c.binding.avif.aar.sha256, 'Resolved AAR bytes differ from the adopted genuine candidate')
    emit('AVIF_RESOLUTION', [task: task.path, configuration: configuration.name,
        coordinate: coordinate.join(':'), artifact: fileRow(f), originalArtifact: true])
}
// Called only at real compiler/Test actions, after their normal configurations have resolved.
def observeResolution = { p, task, configName, usage, platform ->
    def configuration = p.configurations.getByName(configName)
    require(configuration.state.toString() == 'RESOLVED', 'Do not resolve an extra observer configuration')
    def result = configuration.incoming.resolutionResult
    def rootId = result.rootComponent.get().id
    require(rootId instanceof ProjectComponentIdentifier && rootId.projectPath == p.path,
        'Actual resolved root must be this configuration-owning project')
    def edges = result.allDependencies.collect { neutralEdge(it, usage, platform, rootId) }.findAll { it != null }
    def libraries = result.allComponents.findAll {
        it.id instanceof ModuleComponentIdentifier &&
            (it.id.group in ['org.jetbrains.kotlin', 'org.jetbrains.kotlinx', 'com.fleeksoft.ksoup', 'org.jetbrains.skiko',
                'org.jetbrains.compose.ui', 'androidx.compose.ui', 'org.robolectric', 'androidx.room', 'androidx.sqlite', 'dev.datlag'])
    }.collect { [group: it.id.group, module: it.id.module, version: it.id.version] }
    emit('RESOLUTION', [task: task.path, platform: platform, configuration: configName,
        attributes: attrs(configuration.attributes), rootComponent: component(rootId), neutralEdges: edges, libraries: libraries])
    observeAvif(task, configuration)
}
def observeClasspath = { task, files, kind, platform ->
    def entries = files.collect {
        kind == 'compiler' ? compilerClasspathRow(it) : (kind == 'test' ? testClasspathRow(task, it) : fileRow(it))
    }
    emit('CLASSPATH', [task: task.path, kind: kind, platform: platform, entries: entries])
    def classContainers = [:]
    entries.findAll { !it.neutralClasses.isEmpty() }.each { entry ->
        require(c.engineModules.any { entry.path.startsWith(new File(c.engineRoot, it.substring(1) + '/build/').path + '/') },
            'Foreign/cached/transformed neutral supplier; no automatic transform waiver')
        entry.neutralClasses.keySet().each { name ->
            require(!classContainers.containsKey(name) || classContainers[name] == entry.path,
                'Duplicate neutral class across distinct actual containers: ' + name)
            classContainers[name] = entry.path
        }
    }
    def expected = (c.role == 'engine' && task.project.path == ':source-engine') ? ['contracts'] :
        ((c.role == 'app' && (task.path == ':sources:engine:' + c.mains[platform].app || task.path == ':app:testDebugUnitTest')) ? ['contracts', 'engine'] : [])
    expected.each { part -> require(classContainers.keySet().any { it.startsWith(prefix + part + '/') }, 'Missing fresh neutral supplier') }
    c.binding.avif.class_sha256.each { name, digest ->
        def origins = files.collect { f -> [path: f.canonicalPath, sha256: classHash(f, name)] }.findAll { it.sha256 != null }
        if (!origins.isEmpty()) {
            require(origins.every { it.sha256 == digest }, 'Actual AVIF compiler/Test class differs from the genuine candidate')
            emit('AVIF_CLASS_ORIGINS', [task: task.path, entry: name, origins: origins])
        }
    }
}
def rejectJvmRuntime = { t, configName ->
    def configuration = t.project.configurations.getByName(configName)
    require(configuration.state.toString() == 'RESOLVED', 'Observe only the already-resolved Android Test runtime')
    def ids = configuration.incoming.resolutionResult.allComponents*.id
    require(!ids.any { it instanceof ModuleComponentIdentifier && (it.group + ':' + it.module) in
        ['androidx.room:room-runtime-jvm', 'androidx.sqlite:sqlite-bundled-jvm', 'androidx.sqlite:sqlite-jvm'] }, 'No JVM Room/SQLite replacement')
    require(!t.classpath.files.any { it.name.startsWith('room-runtime-jvm-') || it.name.startsWith('sqlite-bundled-jvm-') ||
        it.name.startsWith('sqlite-jvm-') }, 'No smuggled JVM file supplier')
    require(ids.any { it instanceof ModuleComponentIdentifier && it.group == 'org.robolectric' && it.module == 'robolectric' &&
        it.version == '4.16' }, 'Normal Robolectric4.16 runtime required')
}
def androidOrigins = { t, configName ->
