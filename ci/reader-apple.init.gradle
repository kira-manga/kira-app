// Public Reader/UI: normal both-target lower-module compiles plus existing VM Native11.
// App17 observer/filter/device/link seams; no source, dependency, repository or task replacement.
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.nio.file.StandardOpenOption
import java.security.MessageDigest

def require = { ok, message -> if (!ok) throw new GradleException(message.toString()) }
def testPath = ':presentation:iosSimulatorArm64Test'
def linkPath = ':presentation:linkDebugTestIosSimulatorArm64'
def candidate = '17ffa5eb798511b1e8090bed044e4f605031435f' // Primary-bound reviewed source checkpoint.
def candidateTree = 'a4decdff7bc482fbc117d976725c8198556d2651'
def roots = [':ui:compileKotlinIosArm64', ':ui:compileKotlinIosSimulatorArm64', testPath]
def modules = [':core', ':domain', ':presentation', ':ui']
def targets = [IosArm64: 'ios_arm64', IosSimulatorArm64: 'ios_simulator_arm64']
def specs = targets.collectMany { suffix, target -> modules.collect { module ->
    [path: module + ':compileKotlin' + suffix, module: module, suffix: suffix, target: target, test: false]
} }
specs.add([path: ':presentation:compileTestKotlinIosSimulatorArm64', module: ':presentation',
    suffix: 'IosSimulatorArm64', target: 'ios_simulator_arm64', test: true])
def compilePaths = specs*.path
def required = compilePaths + [linkPath, testPath]
def resourceRequired = [':ui:convertXmlValueResourcesForCommonMain', ':ui:generateResourceAccessorsForCommonMain',
    ':ui:generateComposeResClass', ':ui:generateExpectResourceCollectorsForCommonMain',
    ':ui:generateActualResourceCollectorsForIosArm64Main',
    ':ui:generateActualResourceCollectorsForIosSimulatorArm64Main']
def run = new File(System.getenv('READER_APPLE_RUN')).canonicalFile
def reports = new File(run, 'reports')
def sourceSha = System.getenv('READER_APPLE_SOURCE_SHA')
def realHome = new File(System.getenv('READER_APPLE_SIMULATOR_HOME')).canonicalFile
def device = System.getenv('READER_APPLE_DEVICE')
require(candidate instanceof String && candidate ==~ /[0-9a-f]{40}/ && candidate != '0' * 40 &&
    candidateTree instanceof String && candidateTree ==~ /[0-9a-f]{40}/ && candidateTree != '0' * 40,
    'Primary source checkpoint is unbound')
require(run.isDirectory() && reports.isDirectory() && sourceSha == candidate, 'Wrong owned source/run')
// Actual early-init observations, not the controller's declared tools.homes values.
def homeObservation = [
    actualEnvironmentHome: System.getenv('HOME'),
    actualJvmUserHome: System.getProperty('user.home'),
    expectedScratchHome: new File(run, 'home').path,
    realHomeCanonical: realHome.path,
    gradleUserHomeCanonical: gradle.gradleUserHomeDir.canonicalPath,
    explicitStartParameterUserHome: gradle.startParameter.systemPropertiesArgs['user.home']
]
homeObservation.predicates = [
    environmentMatchesScratch: homeObservation.actualEnvironmentHome == homeObservation.expectedScratchHome,
    jvmMatchesScratch: homeObservation.actualJvmUserHome == homeObservation.expectedScratchHome,
    realHomeIsDirectory: realHome.isDirectory(),
    realHomeOutsideRun: !realHome.toPath().startsWith(run.toPath())
]
def homeObservationLine = 'READER_APPLE_HOME_OBSERVATION ' + JsonOutput.toJson(homeObservation)
require(homeObservationLine.getBytes('UTF-8').length <= 8192, 'Oversized allowlisted HOME observation')
logger.lifecycle(homeObservationLine)
require(System.getenv('HOME') == new File(run, 'home').path && System.getProperty('user.home') == new File(run, 'home').path &&
    realHome.isDirectory() && !realHome.toPath().startsWith(run.toPath()), 'Gradle and Simulator homes must stay separate')
require(device ==~ /[0-9A-F]{8}(?:-[0-9A-F]{4}){3}-[0-9A-F]{12}/, 'Missing exact owned device')
require(gradle.gradleVersion == '9.6.1' && System.getProperty('java.specification.version') == '21', 'Wrong Gradle/Java')
// Two growing proof inventories retain every entry; controls/small receipts stay at1MiB.
def receiptLimit = { name -> name in ['library-artifacts.json', 'compilation-inputs.json'] ? 4194304 : 1048576 }
def read = { name ->
    def file = new File(reports, name)
    require(file.isFile() && !Files.isSymbolicLink(file.toPath()) && file.length() <= receiptLimit(name), 'Missing/oversized receipt: ' + name)
    new JsonSlurper().parse(file)
}
def save = { name, value ->
    def data = (JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n').getBytes('UTF-8')
    require(data.length <= receiptLimit(name), 'Oversized required receipt: ' + name)
    def path = new File(reports, name).toPath()
    require(!Files.isSymbolicLink(path), 'Symlink receipt')
    def pending = new File(reports, name + '.pending').toPath()
    Files.write(pending, data, StandardOpenOption.CREATE_NEW, StandardOpenOption.WRITE)
    Files.move(pending, path, StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
}
def sha = { File file ->
    require(file.isFile() && !Files.isSymbolicLink(file.toPath()) && file.length() <= 268435456, 'Invalid/oversized artifact: ' + file)
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[1048576]
        int count
        while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
    }
    digest.digest().encodeHex().toString()
}
def fingerprint = { File file ->
    require(file.exists() && !Files.isSymbolicLink(file.toPath()), 'Missing/symlink artifact: ' + file)
    file = file.canonicalFile
    if (file.isFile()) return [file: file.path, bytes: file.length(), sha256: sha(file)]
    def rows = []
    long bytes = 0
    file.eachFileRecurse { item ->
        require(!Files.isSymbolicLink(item.toPath()), 'Symlink inside klib')
        if (item.isFile()) {
            bytes += item.length()
            require(rows.size() < 1024 && bytes <= 268435456, 'Oversized unpacked klib')
            rows.add([path: file.toPath().relativize(item.toPath()).toString(), bytes: item.length(), sha256: sha(item)])
        }
    }
    rows.sort { it.path }
    require(!rows.empty, 'Empty unpacked klib')
    def tree = rows.collect { it.sha256 + '  ' + it.path + '\n' }.join('').getBytes('UTF-8')
    [file: file.path, bytes: bytes, files: rows, sha256: MessageDigest.getInstance('SHA-256').digest(tree).encodeHex().toString()]
}
def sourceBinding = read('source.json')
def simulator = read('simulator.json')
def request = read('request.json')
def selectors = sourceBinding.selectors
def source = new File(sourceBinding.root).canonicalFile
require(sourceBinding.sha == sourceSha && sourceBinding.tree == candidateTree &&
    request.sourceSha == sourceSha && request.selectors == selectors && selectors.size() == 11 && selectors.toSet().size() == 11 &&
    simulator.udid == device && simulator.runnerHome == realHome.path, 'Different source/selector/Simulator binding')
def arguments = roots + selectors.collectMany { ['--tests', it] } + ['--device', device]
require(gradle.startParameter.taskNames in [roots, arguments] && !gradle.startParameter.dryRun &&
    !gradle.startParameter.offline && gradle.startParameter.excludedTaskNames.empty, 'Only exact normal Apple01 tasks/options')
def compiled = [:]
def resources = [:]
def ended = [] as Set
def states = [:]
def graphPaths = []
def dependencies = [':core': [], ':domain': [':core'], ':presentation': [':core', ':domain'], ':ui': [':core', ':domain', ':presentation']]
def stdlib = new File(run, 'konan/kotlin-native-prebuilt-macos-aarch64-2.4.0/klib/common/stdlib').canonicalFile
def maven = new File(run, 'gradle-home/caches/modules-2/files-2.1').canonicalFile.toPath()
def platformBase = new File(run, 'konan/kotlin-native-prebuilt-macos-aarch64-2.4.0/klib/platform').toPath()
def platformPrefix = 'org.jetbrains.kotlin.native.platform.'
def libraryArtifacts = [:] // Keep each full leaf inventory once, not once per compiler that consumes it.
def libraries = { collection, target, expectedProjects ->
    def rows = collection.collect { it.absoluteFile }.sort { it.canonicalPath }.collect { input ->
        def file = input.canonicalFile
        def platformInput = file.toPath().startsWith(platformBase) || input.toPath().startsWith(platformBase)
        if (platformInput) {
            def parent = platformBase.resolve(target).toFile()
            def name = file.isDirectory() ? file.name : (file.isFile() && file.name.endsWith('.klib') ? file.name.dropRight(5) : '')
            require(target in targets.values() && input == file && parent.canonicalFile == parent &&
                file.parentFile == parent && !Files.isSymbolicLink(input.toPath()) &&
                name.startsWith(platformPrefix) && name.length() > platformPrefix.length(),
                'Invalid owned Native platform input: ' + input)
        }
        def value = fingerprint(file)
        require(!libraryArtifacts.containsKey(file.path) || libraryArtifacts[file.path] == value, 'Changed previously observed library')
        libraryArtifacts[file.path] = value
        def reference = [file: value.file, bytes: value.bytes, sha256: value.sha256]
        def normal = compiled.find { task, row -> row.target == target && row.output?.file == file.path }
        if (normal) {
            require(value == normal.value.output, 'Changed normal project KLIB: ' + file)
            return [origin: 'normal-project-output', task: normal.key, fingerprint: reference]
        }
        if (file == stdlib) return [origin: 'owned-native-stdlib', fingerprint: reference]
        if (platformInput) return [origin: 'owned-native-platform', target: target, fingerprint: reference]
        require(file.toPath().startsWith(maven), 'Unattributed compiler/link library: ' + file)
        def parts = maven.relativize(file.toPath()).collect { it.toString() }
        // Gradle9.6.1 stores SHA-1 hex without leading zeros (GroupedAndNamedUniqueFileStore).
        require(parts.size() == 5 && parts[0] != 'me.manga.kira.source' && parts[3] ==~ /[0-9a-f]{1,40}/ &&
            file.name.endsWith('.klib'), 'Nonpublic/non-KLIB dependency input: ' + file)
        [origin: 'normal-gradle-module-cache', coordinate: parts.take(3).join(':'), artifact: file.name, fingerprint: reference]
    }
    save('library-artifacts.json', libraryArtifacts)
    require(!rows.empty && rows.findAll { it.origin == 'normal-project-output' }*.task.toSet() == expectedProjects.toSet(),
        'Missing/extra normal project library inputs')
    rows
}

gradle.taskGraph.whenReady { graph ->
    graphPaths = graph.allTasks*.path
    require(gradle.rootProject.projectDir.canonicalFile == source, 'Wrong normal source project')
    def metadataProjects = [':core', ':platform', ':composeApp', ':domain', ':data', ':data:local', ':data:remote', ':data:download',
        ':presentation', ':ui', ':sources:contracts', ':sources:engine', ':sources:config', ':sources:legacy']
    def setup = ['kmpPartiallyResolvedDependenciesChecker', 'checkKotlinGradlePluginConfigurationErrors', 'downloadKotlinNativeDistribution'] +
        targets.keySet().collectMany { suffix -> ['exportCrossCompilationMetadataFor' + suffix + 'ApiElements',
            suffix[0].toLowerCase() + suffix.substring(1) + 'ProcessResources', suffix[0].toLowerCase() + suffix.substring(1) + 'MainKlibrary'] }
    def sourceSets = ['CommonMain', 'NativeMain', 'AppleMain', 'IosMain', 'IosArm64Main', 'IosSimulatorArm64Main']
    def resourceNames = ['generateComposeResClass', 'generateExpectResourceCollectorsForCommonMain'] + sourceSets.collectMany { name ->
        ['convertXmlValueResourcesFor', 'copyNonXmlValueResourcesFor', 'prepareComposeResourcesTaskFor', 'generateResourceAccessorsFor'].collect { it + name }
    } + targets.keySet().collectMany { suffix -> ['generateActualResourceCollectorsFor' + suffix + 'Main',
        'check' + suffix + 'MainComposeLibrariesCompatibility', 'assemble' + suffix + 'MainResources'] }
    def inert = [':presentation:computeLocalPackageDependencyInputFiles', ':presentation:convertSyntheticImportProjectIntoDefFileIphonesimulator']
    def skipOnly = [':presentation:generateSyntheticLinkageSwiftPMImportProjectForCinteropsAndLdDump',
        ':presentation:syncPersistedPackageResolvedToSynthetic', ':presentation:fetchSyntheticImportProjectPackages',
        ':composeApp:generateUmbrellaPackageIdentifierBasedResolutionForDefault', ':composeApp:fetchUmbrellaPackageIdentifierForDefault']
    def allowed = required + inert + skipOnly + [':commonizeNativeDistribution'] +
        metadataProjects.collect { it + ':serializeSwiftPMDependenciesMetadataForLockFiles' } +
        modules.collectMany { project -> setup.collect { project + ':' + it } } + resourceNames.collect { ':ui:' + it }
    save('task-graph.json', [requestedTasks: roots, sourceSha: sourceSha,
        graph: graph.allTasks.collect { [path: it.path, type: it.class.name] }, skipOnly: skipOnly])
    require(graphPaths.containsAll(required + resourceRequired) && graphPaths.every { it in allowed },
        'Unexpected graph outside normal four modules + finite resource/SwiftPM bookkeeping')
    graph.allTasks.each { t ->
        if (t.path in skipOnly) t.doFirst { throw new GradleException('SwiftPM fetch/build/umbrella action must remain normally skipped: ' + t.path) }
        if (t.path == ':presentation:convertSyntheticImportProjectIntoDefFileIphonesimulator') t.doFirst {
            require(t.hasSwiftPMDependencies.get() == false, 'Actual SwiftPM compilation is outside Reader Apple01')
        }
        if (t.project.path == ':ui' && t.name in resourceNames) t.doLast {
            def files = t.outputs.files.asFileTree.files.sort { it.path }
            require(files.size() <= 1024 && files.every { it.canonicalFile.toPath().startsWith(source.toPath().resolve('ui/build')) }, 'Unowned/oversized UI resource output')
            resources[t.path] = [sourceSha: sourceSha, outputs: files.collect { fingerprint(it) }, actionsReachedEnd: true]
            ended.add(t.path)
            save('resource-outputs.json', resources)
        }
        def spec = specs.find { it.path == t.path }
        if (spec) {
            t.doFirst {
                def actual = t.sources.files.sort { it.path }
                require(actual.size() <= 1024 && actual.every { it.canonicalFile.toPath().startsWith(source.toPath()) }, 'Unowned/oversized actual compiler sources')
                def sources = actual.collectEntries { file -> [(t.project.rootProject.relativePath(file)): sha(file)] }
                def generated = [:]
                if (spec.module == ':ui') {
                    def generators = ['generateComposeResClass', 'generateExpectResourceCollectorsForCommonMain',
                        'generateActualResourceCollectorsFor' + spec.suffix + 'Main'] +
                        ['CommonMain', 'NativeMain', 'AppleMain', 'IosMain', spec.suffix + 'Main'].collect { 'generateResourceAccessorsFor' + it }
                    resources.findAll { path, row -> path in generators.collect { ':ui:' + it } }.values().each { row ->
                        row.outputs.findAll { it.file.endsWith('.kt') }.each { output ->
                            generated[t.project.rootProject.relativePath(output.file)] = output.sha256
                        }
                    }
                    require(!generated.empty, 'Missing actual normal generated UI Kotlin inputs')
                }
                require(t.target == spec.target && sources == sourceBinding.compilations[t.path] + generated,
                    'Wrong target/missing/extra/pruned compiler sources: ' + t.path)
                def projectInputs = (dependencies[spec.module] + (spec.test ? [spec.module] : [])).collect { it + ':compileKotlin' + spec.suffix }
                compiled[t.path] = [sourceSha: sourceSha, sources: sources, generatedSources: generated, target: t.target,
                    libraries: libraries(t.libraries.files, spec.target, projectInputs), actionsReachedEnd: false]
                save('compilation-inputs.json', compiled)
            }
            t.doLast {
                compiled[t.path].output = fingerprint(t.klibOutput.get())
                compiled[t.path].actionsReachedEnd = true
                ended.add(t.path)
                save('compilation-inputs.json', compiled)
            }
        }
        if (t.path == linkPath) {
            def nativeTarget = t.binary.target.konanTarget.name
            t.doFirst {
                def projects = [':core', ':domain', ':presentation'].collect { it + ':compileKotlinIosSimulatorArm64' }
                require(nativeTarget == 'ios_simulator_arm64' && ended.containsAll(projects + [':presentation:compileTestKotlinIosSimulatorArm64']), 'Missing normal simulator prerequisites')
                def includes = t.'getSourceFiles$kotlin_gradle_plugin_common'().files.collect { fingerprint(it) }
                require(includes == [compiled[':presentation:compileTestKotlinIosSimulatorArm64'].output], 'Wrong actual -Xinclude test KLIB')
                def inputs = libraries(t.libraries.files, nativeTarget, projects)
                require(inputs.count { it.origin == 'owned-native-stdlib' } == 1 && System.getenv('KONAN_DATA_DIR') == new File(run, 'konan').path, 'Missing owned Native stdlib')
                save('link-inputs.json', [task: t.path, sourceSha: sourceSha, target: nativeTarget,
                    libraries: inputs, includes: includes, linkerOpts: t.linkerOpts])
            }
            t.doLast {
                save('linked-binary.json', fingerprint(t.outputFile.get()) + [task: t.path, sourceSha: sourceSha, target: nativeTarget])
                ended.add(t.path)
            }
        }
        if (t.path == testPath) {
            t.standalone.set(false)
            t.environment('HOME', realHome.path)
            t.filter.failOnNoMatchingTests = true
            t.ignoreFailures = false
            t.ignoreRunFailures = false
            t.reports.junitXml.required.set(true)
            t.reports.junitXml.outputLocation.set(new File(reports, 'xml'))
            t.outputs.upToDateWhen { false }
            t.doFirst {
                require(t.includePatterns == (selectors as Set) && t.excludePatterns.empty && t.args.empty && !t.debugMode, 'Missing/broader/hidden Native selectors')
                require(t.device.get() == device && t.environment['HOME'] == realHome.path && t.targetName == 'iosSimulatorArm64', 'Wrong owned device/home/Native target')
                def linked = read('linked-binary.json')
                require(t.executable.canonicalPath == linked.file && sha(t.executable) == linked.sha256, 'Test does not execute the newly linked binary')
                save('test-invocation.json', [task: t.path, sourceSha: sourceSha, selectors: selectors.sort(), device: device,
                    standalone: t.standalone.get(), targetName: t.targetName, simulatorHome: t.environment['HOME'],
                    executable: t.executable.canonicalPath, sha256: sha(t.executable)])
            }
            t.doLast { ended.add(t.path) }
        }
    }
}
gradle.taskGraph.afterTask { task, state ->
    states[task.path] = [executed: state.executed, didWork: state.didWork, skipped: state.skipped, upToDate: state.upToDate,
        noSource: state.noSource, failure: state.failure?.toString(), actionsReachedEnd: ended.contains(task.path)]
    save('task-proof.json', [schema: 'reader-apple01-task-v1', requestedTasks: roots, sourceSha: sourceSha,
        gradleVersion: gradle.gradleVersion, javaVersion: System.getProperty('java.runtime.version'), graph: graphPaths, states: states])
}
