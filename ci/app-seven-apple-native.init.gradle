// App70 ordinary core/platform main/test compile + one test-binary link. No test task actions.
// No source/dependency/compiler replacement, host harness, composite build or Engine route.
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.nio.file.StandardOpenOption
import java.security.MessageDigest
import org.gradle.api.tasks.testing.AbstractTestTask

def require = { ok, message -> if (!ok) throw new GradleException(message.toString()) }
def run = new File(System.getenv('KIRA_APP5_RUN') ?: '/UNBOUND').canonicalFile
def control = new File(System.getenv('KIRA_APP5_CONTROL') ?: '/UNBOUND').canonicalFile
def reports = new File(run, 'reports')
def read = { name ->
    def file = new File(reports, name)
    require(file.isFile() && !Files.isSymbolicLink(file.toPath()) && file.length() <= 1048576, 'Bound report required')
    new JsonSlurper().parse(file)
}
def source = read('source.json')
def nativeSource = read('native-source.json')
def request = read('request.json')
def candidate = 'd4a18aac34a32f8332af9aa91d196fb69fd93550'
require(candidate ==~ /[0-9a-f]{40}/ && request.schema == 'app70-apple-capture-v1' &&
    request.status == 'PRIMARY_BOUND_FOR_REVIEW' && request.mode == 'APP70_CAPTURE_ONLY' &&
    request.authorization == 'APP70_APPLE_CAPTURE_ONE_ATTEMPT_AUTHORIZED' &&
    request.app.sha == candidate && source.app.sha == candidate &&
    nativeSource.app == request.app && nativeSource.root == source.app.root && source.keySet() == (['app'] as Set),
    'No direct/unbound native invocation')
// Linking has no CoreSimulator dependency. The Python capture owner creates and
// binds its one device only after the real binary and stopped link owner pass.
def compilePaths = [':platform:compileTestKotlinIosSimulatorArm64']
def linkPaths = [':platform:linkDebugTestIosSimulatorArm64']
require(request.nativeTasks == linkPaths && nativeSource.compilations.keySet() == (compilePaths as Set) &&
    nativeSource.selector == 'me.manga.kira.platform.download.BgDownloadLogAppleWriterCanaryTest.defaultAppleWriterEmitsCanaryForExternalCapture',
    'Exactly the ordinary platform test link and single externally selected canary')
def modules = [':core', ':platform']
// Exact non-compilation prerequisites observed in run35011600633's ordinary
// platform link graph. This is not permission to compile any of these modules.
def swiftMetadataType = 'org.jetbrains.kotlin.gradle.plugin.mpp.apple.swiftimport.SerializeSwiftPMDependenciesMetadataForLockFiles_Decorated'
def auxiliaryTasks = [
    ':composeApp:serializeSwiftPMDependenciesMetadataForLockFiles': swiftMetadataType,
    ':data:serializeSwiftPMDependenciesMetadataForLockFiles': swiftMetadataType,
    ':domain:serializeSwiftPMDependenciesMetadataForLockFiles': swiftMetadataType,
    ':presentation:serializeSwiftPMDependenciesMetadataForLockFiles': swiftMetadataType,
    ':ui:serializeSwiftPMDependenciesMetadataForLockFiles': swiftMetadataType,
    ':data:download:serializeSwiftPMDependenciesMetadataForLockFiles': swiftMetadataType,
    ':data:local:serializeSwiftPMDependenciesMetadataForLockFiles': swiftMetadataType,
    ':data:remote:serializeSwiftPMDependenciesMetadataForLockFiles': swiftMetadataType,
    ':sources:config:serializeSwiftPMDependenciesMetadataForLockFiles': swiftMetadataType,
    ':sources:contracts:serializeSwiftPMDependenciesMetadataForLockFiles': swiftMetadataType,
    ':sources:engine:serializeSwiftPMDependenciesMetadataForLockFiles': swiftMetadataType,
    ':sources:legacy:serializeSwiftPMDependenciesMetadataForLockFiles': swiftMetadataType,
    ':composeApp:generateUmbrellaPackageIdentifierBasedResolutionForDefault': 'org.jetbrains.kotlin.gradle.plugin.mpp.apple.swiftimport.GenerateSyntheticLinkageImportProject_Decorated',
    ':composeApp:fetchUmbrellaPackageIdentifierForDefault': 'org.jetbrains.kotlin.gradle.plugin.mpp.apple.swiftimport.FetchSyntheticImportProjectPackages_Decorated'
]
def c = [role: 'app', graph: [], observed: [:], states: [:],
    mains: modules.collect { it + ':compileKotlinIosSimulatorArm64' }]
def hashBytes = { byte[] bytes -> MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() }
def sha = { File file, long cap = 1073741824L ->
    require(file.isFile() && file.canonicalPath == file.absolutePath && !Files.isSymbolicLink(file.toPath()) &&
        file.length() <= cap, 'Invalid/oversized Native evidence file')
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[1048576]
        for (int count; (count = stream.read(buffer)) != -1;) digest.update(buffer, 0, count)
    }
    digest.digest().encodeHex().toString()
}
def fingerprint = { File file ->
    require(file.exists() && file.canonicalPath == file.absolutePath && !Files.isSymbolicLink(file.toPath()), 'Unowned Native output')
    if (file.isFile()) return [file: file.path, kind: 'file', bytes: file.length(), sha256: sha(file)]
    def rows = []
    long bytes = 0
    file.eachFileRecurse { child ->
        require(!Files.isSymbolicLink(child.toPath()), 'Symlink Native KLIB entry')
        if (child.isFile()) {
            bytes += child.length()
            require(rows.size() < 4096 && bytes <= 268435456, 'Native test KLIB cap')
            rows.add([path: file.toPath().relativize(child.toPath()).toString(), sha256: sha(child)])
        }
    }
    rows.sort { it.path }
    require(!rows.empty, 'Empty Native KLIB')
    [file: file.path, kind: 'directory', bytes: bytes, files: rows.size(),
        sha256: hashBytes(rows.collect { it.sha256 + '  ' + it.path + '\n' }.join('').getBytes('UTF-8'))]
}
def save = {
    def bytes = (JsonOutput.prettyPrint(JsonOutput.toJson([role: c.role, source: source.app.sha,
        linkTasks: linkPaths, nativeTestTaskActions: 0, graph: c.graph, observed: c.observed, states: c.states])) + '\n').getBytes('UTF-8')
    require(bytes.length <= 1048576, 'Native task report cap')
    def name = 'native-' + c.role + '-tasks.json'
    def file = new File(reports, name).toPath()
    def pending = new File(reports, name + '.pending').toPath()
    require(!Files.isSymbolicLink(file), 'Aliased Native report')
    Files.write(pending, bytes, StandardOpenOption.CREATE_NEW, StandardOpenOption.WRITE)
    Files.move(pending, file, StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
}
def libraries = { t ->
    def files = t.libraries.files.sort { it.path }
    def owners = [source.app.root, new File(run, 'gradle-home/caches').path, new File(run, 'konan').path]
    require(!files.empty && files.size() <= 512 && files.every { file ->
        file.exists() && file.canonicalPath == file.absolutePath && !file.path.contains('/me.manga.kira.source/') &&
            owners.any { file.path.startsWith(it + '/') }
    }, 'Unowned/published-neutral/oversized Native libraries')
    files*.path // Actual ordinary inputs, not another expanded all-library provenance framework.
}
def nativeCompiler = { t ->
    def version = '2.4.0'
    require(t.target == 'ios_simulator_arm64' && t.kotlinNativeVersion == version &&
        new File(t.konanHome.get().toString()).canonicalFile == new File(run, 'konan/kotlin-native-prebuilt-macos-aarch64-' + version),
        'Wrong actual Native target/compiler/home')
}
gradle.settingsEvaluated { settings ->
    def root = settings.settingsDir.canonicalFile
    require(root.path == source.app.root && root == new File(control.parentFile, 'app'), 'Only exact ordinary App checkout')
    require(gradle.gradleVersion == '9.6.1' && System.getProperty('java.specification.version') == '21' &&
        !gradle.startParameter.offline && !gradle.startParameter.dryRun && gradle.startParameter.excludedTaskNames.empty &&
        gradle.startParameter.maxWorkerCount == 1 && !gradle.startParameter.parallelProjectExecutionEnabled &&
        !gradle.startParameter.buildCacheEnabled && !gradle.startParameter.configurationCacheRequested, 'Ordinary one-worker uncached work')
    require(System.getenv('HOME') == new File(run, 'home').path && System.getProperty('user.home') == new File(run, 'home').path &&
        gradle.gradleUserHomeDir.canonicalFile == new File(run, 'gradle-home') &&
        System.getenv('KONAN_DATA_DIR') == new File(run, 'konan').path, 'Isolated Gradle/Native scratch homes')
    require(gradle.startParameter.taskNames == linkPaths, 'Only the literal platform test-link root')
}
gradle.projectsEvaluated {
    require(gradle.includedBuilds.empty, 'No composite Engine or dependency substitution build')
    gradle.rootProject.allprojects.each { p ->
        require(['kotlin.native.home', 'kotlin.native.version', 'kotlin.native.distribution.type'].every { p.findProperty(it) == null },
            'No global Native home/version/distribution override')
    }
}
gradle.taskGraph.whenReady { graph ->
    c.graph = graph.allTasks.collect { [path: it.path, type: it.class.name] }
    save()
    require(graph.allTasks*.path.containsAll(c.mains + compilePaths + linkPaths + auxiliaryTasks.keySet()),
        'Missing ordinary core/platform compile/link or observed auxiliary closure')
    graph.allTasks.each { t ->
        require((t.project.path in (modules + [':']) || auxiliaryTasks[t.path] == t.class.name) && !(t instanceof AbstractTestTask) &&
            (!t.class.name.contains('KotlinNativeLink') || t.path in linkPaths) &&
            !t.class.name.contains('PublishToMaven') && !(t.name in ['downloadKcef', 'setupKcef', 'extractKcef']),
            'No other tests/framework/link/publication/CEF work')
        if (t.name.startsWith('compile') && t.name.contains('Kotlin') && !t.name.contains('Metadata'))
            require(t.path in c.mains || t.path in compilePaths, 'No independent iosArm64/JVM/other compiler')
        if (t.path in c.mains || t.path in compilePaths) {
            t.doFirst {
                nativeCompiler(t)
                def expected = t.path in c.mains ? source.app.mains[t.project.path] : nativeSource.compilations[t.path]
                def files = t.sources.files.findAll { it.name.endsWith('.kt') }
                def made = files.findAll { it.canonicalPath.startsWith(t.project.buildDir.canonicalPath + '/') }
                def original = (files - made).collectEntries { [(t.project.rootProject.relativePath(it)): sha(it)] }
                require(files.size() <= 4096 && original == expected && made.every {
                    it.canonicalPath.startsWith(t.project.buildDir.canonicalPath + '/generated/') }, 'Pruned/extra ordinary main/test sources')
                c.observed[t.path] = [target: t.target, sourcesMatched: true, sourceCount: original.size(),
                    sourceDigest: hashBytes(original.sort().collect { name, digest -> digest + '  ' + name + '\n' }.join('').getBytes('UTF-8')),
                    generated: made.collectEntries { [(it.path): sha(it)] }, libraries: libraries(t)]
                save()
            }
            t.doLast { c.observed[t.path].output = fingerprint(t.klibOutput.get()); c.observed[t.path].ended = true; save() }
        }
        if (t.path in linkPaths) {
            def compilePath = compilePaths[linkPaths.indexOf(t.path)]
            t.doFirst {
                def includes = t.'getSourceFiles$kotlin_gradle_plugin_common'().files.collect { fingerprint(it) }
                require(c.observed[compilePath]?.ended && includes == [c.observed[compilePath].output] &&
                    t.binary.target.konanTarget.name == 'ios_simulator_arm64', 'Link must consume the real freshly compiled test KLIB')
                c.observed[t.path] = [target: t.binary.target.konanTarget.name, includes: includes, libraries: libraries(t)]
                save()
            }
            t.doLast { c.observed[t.path].output = fingerprint(t.outputFile.get()); c.observed[t.path].ended = true; save() }
        }
    }
}
gradle.taskGraph.afterTask { task, state ->
    if (task.path in c.mains && !state.failure && !state.noSource) nativeCompiler(task)
    c.states[task.path] = [executed: state.executed, didWork: state.didWork, skipped: state.skipped, upToDate: state.upToDate,
        noSource: state.noSource, failure: state.failure?.class?.name, ended: c.observed[task.path]?.ended == true]
    save()
}
