# Project-wide Gradle settings — carried forward from source where applicable, with KMP additions.

# JVM
# Kotlin/Native Release LTO exceeded the former 4 GiB heap on the arm64 device framework. Six
# GiB fits GitHub's macOS runners and leaves headroom for Xcode while keeping the compiler stable.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.enableR8.fullMode=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.jvm=true
kotlin.caching.enabled=true
# Share the libwebp cinterop bindings into the shared iosMain source set (so IosLibWebpEncoder can be
# written once, not per iOS target). Only affects the single libwebp cinterop — the repo has no others.
kotlin.mpp.enableCInteropCommonization=true

# Compose Multiplatform
org.jetbrains.compose.experimental.uikit.enabled=true

# Allow packaging (jpackage) with the locally-installed Homebrew JDK. Compose blocks Homebrew JDKs
# by default (JetBrains/compose-multiplatform#3107) because some layouts break the bundled runtime
# image. The desktop `.app`/`.dmg` produced here was verified to launch standalone with the
# Homebrew JDK 17 toolchain; for CI/release prefer a non-Homebrew JDK (Temurin/Corretto).
compose.desktop.packaging.checkJdkVendor=false
