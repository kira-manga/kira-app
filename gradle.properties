# Project-wide Gradle settings — carried forward from source where applicable, with KMP additions.

# JVM
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.enableR8.fullMode=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.jvm=true
kotlin.caching.enabled=true
# Share the libwebp cinterop bindings into the shared iosMain source set (so IosLibWebpEncoder can be
# written once, not per iOS target). Only affects the single libwebp cinterop — the repo has no others.
kotlin.mpp.enableCInteropCommonization=true

# CrashKiOS (co.touchlab.crashkios:crashlytics) requires disabling the Kotlin/Native compiler cache
# for the iOS simulator target — its Crashlytics cinterop hits a known klib-cache linking issue
# otherwise. Only iosSimulatorArm64 needs it (we have no iosX64; device iosArm64 builds are unaffected).
# Cost: slower CLEAN simulator builds (no klib cache); incremental and device builds are unaffected.
kotlin.native.cacheKind.iosSimulatorArm64=none

# Compose Multiplatform
org.jetbrains.compose.experimental.uikit.enabled=true

# Allow packaging (jpackage) with the locally-installed Homebrew JDK. Compose blocks Homebrew JDKs
# by default (JetBrains/compose-multiplatform#3107) because some layouts break the bundled runtime
# image. The desktop `.app`/`.dmg` produced here was verified to launch standalone with the
# Homebrew JDK 17 toolchain; for CI/release prefer a non-Homebrew JDK (Temurin/Corretto).
compose.desktop.packaging.checkJdkVendor=false

